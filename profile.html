<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Brotein | Profile</title>
    <link rel="icon" type="image/x-icon" href="broteinico.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0d0d0d;
            --panel: #151515;
            --text: #f3f3f1;
            --muted: #b2b2ad;
            --line: rgba(255,255,255,0.1);
            --chip: rgba(255,255,255,0.06);
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: "Inter", sans-serif;
            background: linear-gradient(180deg, #070707 0%, var(--bg) 26%, #101010 100%);
            color: var(--text);
            overflow-x: hidden;
            -webkit-text-size-adjust: 100%;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        .page-shell {
            width: min(1180px, calc(100% - 24px));
            max-width: 1180px;
            margin: 0 auto;
        }

        header {
            position: sticky;
            top: 0;
            z-index: 10;
            backdrop-filter: blur(16px);
            background: rgba(13, 13, 13, 0.7);
            border-bottom: 1px solid var(--line);
        }

        .nav {
            height: 76px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 18px;
        }

        .brand {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            color: var(--text);
            font-size: 1.05rem;
            font-weight: 700;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            min-width: 0;
        }

        .nav-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .account-wrap {
            position: relative;
            padding-bottom: 14px;
            margin-bottom: -14px;
        }

        .account-trigger {
            width: 38px;
            height: 38px;
            border: 1px solid var(--line);
            border-radius: 50%;
            background: rgba(255,255,255,0.03);
            color: var(--text);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
            padding: 0;
        }

        .account-trigger:hover {
            background: rgba(255,255,255,0.08);
        }

        .account-trigger svg {
            width: 18px;
            height: 18px;
            fill: currentColor;
        }

        .account-menu {
            position: absolute;
            top: calc(100% + 10px);
            left: 50%;
            transform: translateX(-50%) translateY(6px);
            opacity: 0;
            pointer-events: none;
            width: 190px;
            background: rgba(18,18,18,0.98);
            border: 1px solid var(--line);
            border-radius: 16px;
            padding: 12px;
            box-shadow: 0 14px 28px rgba(0,0,0,0.28);
            transition: opacity 0.2s ease, transform 0.2s ease;
            transition-delay: 0.08s;
        }

        .account-wrap:hover .account-menu,
        .account-wrap:focus-within .account-menu,
        .account-wrap.is-open .account-menu {
            opacity: 1;
            pointer-events: auto;
            transform: translateX(-50%) translateY(0);
        }

        .account-name {
            font-size: 0.78rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--muted);
            margin-bottom: 10px;
            text-align: center;
        }

        .account-name.premium-user {
            background: linear-gradient(135deg, #facc15, #f59e0b, #f97316);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .account-menu .menu-btn {
            width: 100%;
            border: 1px solid rgba(255,255,255,0.12);
            background: rgba(255,255,255,0.04);
            color: var(--text);
            border-radius: 999px;
            padding: 10px 12px;
            font: inherit;
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            cursor: pointer;
        }

        .account-menu .upgrade-btn {
            display: none;
            margin-top: 10px;
            background: linear-gradient(135deg, #facc15, #f59e0b, #f97316);
            border-color: rgba(251,191,36,0.6);
            color: #1b1208;
            box-shadow: 0 10px 20px rgba(249,115,22,0.18);
        }

        .account-menu .logout-btn {
            display: none;
            margin-top: 10px;
        }

        .account-menu .profile-btn {
            display: none;
            margin-top: 10px;
        }

        .brand-logo {
            display: block;
            width: 110px;
            height: auto;
            object-fit: contain;
            filter: brightness(1.05);
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 28px;
            font-size: 0.8rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--muted);
        }

        .nav-cta {
            border: 1px solid rgba(255,255,255,0.18);
            padding: 12px 18px;
            border-radius: 999px;
            font-size: 0.8rem;
            font-weight: 600;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            transition: all 0.2s ease;
            background: linear-gradient(180deg, rgba(255,255,255,0.04), rgba(255,255,255,0.01));
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.12), 0 6px 18px rgba(0,0,0,0.18);
        }

        .nav-cta:hover {
            background: var(--text);
            color: var(--bg);
        }

        main {
            padding: 56px 0 80px;
        }

        .hero {
            text-align: center;
            margin-bottom: 42px;
        }

        .eyebrow {
            display: inline-block;
            padding: 10px 14px;
            border: 1px solid var(--line);
            border-radius: 999px;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            font-size: 0.7rem;
            color: var(--muted);
            margin-bottom: 18px;
        }

        h1 {
            margin: 0;
            font-size: clamp(2.8rem, 6vw, 6rem);
            letter-spacing: -0.07em;
            line-height: 0.9;
        }

        .subtitle {
            max-width: 650px;
            margin: 18px auto 0;
            color: var(--muted);
            font-size: 1.05rem;
            line-height: 1.75;
        }

        .plan-grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 20px;
            margin-top: 36px;
        }

        .custom-plan {
            margin-top: 36px;
            padding: 26px 20px;
            background: linear-gradient(180deg, rgba(255,255,255,0.04), rgba(255,255,255,0.01));
            border: 1px solid var(--line);
            border-radius: 28px;
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.08), 0 12px 30px rgba(0,0,0,0.12);
        }

        .custom-plan h2 {
            margin: 0 0 18px;
            font-size: clamp(1.8rem, 2.8vw, 2.8rem);
            letter-spacing: -0.06em;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 18px;
        }

        .field {
            display: grid;
            gap: 8px;
        }

        .field.full {
            grid-column: 1 / -1;
        }

        label {
            font-size: 0.72rem;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--muted);
        }

        input, select, button {
            font: inherit;
        }

        input, select {
            width: 100%;
            border: 1px solid var(--line);
            border-radius: 14px;
            background: rgba(255,255,255,0.04);
            color: var(--text);
            padding: 14px 14px;
            color-scheme: dark;
            font-size: 16px;
        }

        select {
            appearance: none;
            background-image:
                linear-gradient(45deg, transparent 50%, var(--text) 50%),
                linear-gradient(135deg, var(--text) 50%, transparent 50%);
            background-position: calc(100% - 18px) calc(50% - 2px), calc(100% - 12px) calc(50% - 2px);
            background-size: 6px 6px, 6px 6px;
            background-repeat: no-repeat;
            padding-right: 36px;
        }

        select option {
            background: #171717;
            color: var(--text);
        }

        input:focus, select:focus {
            outline: none;
            border-color: rgba(255,255,255,0.28);
            box-shadow: 0 0 0 3px rgba(255,255,255,0.06);
        }

        .generate-button {
            margin-top: 18px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            border: 1px solid rgba(255,255,255,0.18);
            border-radius: 999px;
            background: var(--text);
            color: var(--bg);
            min-width: 220px;
            padding: 15px 24px;
            font-size: 0.76rem;
            font-weight: 700;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            cursor: pointer;
            transition: transform 0.2s ease, opacity 0.2s ease;
        }

        .generate-button:hover:not(:disabled) {
            transform: translateY(-1px);
        }

        .generate-button:disabled {
            opacity: 0.75;
            cursor: wait;
        }

        .pdf-icon {
            width: 16px;
            height: 18px;
            display: inline-block;
            flex-shrink: 0;
        }

        .plan-status {
            min-height: 20px;
            margin-top: 14px;
            font-size: 0.72rem;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            color: var(--muted);
        }

        .plan-status.error {
            color: #ff8e8e;
        }

        .plan-status.success {
            color: #9ce6b4;
        }

        .plan-card {
            background: linear-gradient(180deg, rgba(255,255,255,0.04), rgba(255,255,255,0.01));
            border: 1px solid var(--line);
            border-radius: 26px;
            padding: 24px 20px;
        }

        .plan-card .day {
            display: inline-block;
            font-size: 0.72rem;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--muted);
            margin-bottom: 18px;
        }

        .plan-card h2 {
            margin: 0 0 18px;
            font-size: 1.6rem;
            letter-spacing: -0.05em;
        }

        .plan-card ul {
            list-style: none;
            padding: 0;
            margin: 0;
            display: grid;
            gap: 10px;
            color: var(--muted);
        }

        .plan-card li {
            display: flex;
            align-items: flex-start;
            gap: 8px;
            line-height: 1.6;
        }

        .plan-card li::before {
            content: "•";
            color: var(--text);
            font-size: 1.2rem;
            line-height: 1;
            margin-top: 2px;
        }

        .cta {
            display: inline-block;
            margin-top: 36px;
            padding: 16px 24px;
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 999px;
            text-decoration: none;
            color: var(--text);
            font-size: 0.8rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            font-weight: 700;
        }

        @media (max-width: 980px) {
            .page-shell {
                width: min(100%, calc(100% - 18px));
            }
        }

        @media (max-width: 820px) {
            .nav {
                gap: 12px;
                flex-wrap: wrap;
            }

            .nav-left {
                flex: 1;
                min-width: 0;
            }

            .nav-cta {
                margin-left: auto;
            }

            .nav-links {
                display: none;
            }

            .nav-cta {
                padding: 10px 14px;
                font-size: 0.68rem;
            }

            .brand-logo {
                width: 90px;
            }

            .plan-grid,
            .form-grid {
                grid-template-columns: 1fr;
            }

            .page-shell {
                width: min(100%, calc(100% - 20px));
            }

            .cta,
            .generate-button {
                width: 100%;
                text-align: center;
            }
        }

        @media (max-width: 480px) {
            header {
                padding-top: 18px;
            }

            .nav {
                gap: 8px;
            }

            .nav-left {
                gap: 8px;
            }

            .account-trigger {
                width: 34px;
                height: 34px;
            }

            .account-menu {
                width: 170px;
            }

            .brand {
                font-size: 0.86rem;
                letter-spacing: 0.08em;
            }

            .brand-logo {
                width: 82px;
            }

            .nav-cta {
                padding: 9px 12px;
                font-size: 0.62rem;
                letter-spacing: 0.06em;
            }

            h1 {
                font-size: clamp(2.2rem, 16vw, 4rem);
            }

            .subtitle {
                font-size: 0.96rem;
            }

            .custom-plan,
            .plan-card {
                padding: 18px 16px;
            }

            .plan-card h2 {
                font-size: 1.4rem;
            }

            .generate-button {
                min-width: 0;
            }
        }

        .profile-grid {
            display: grid;
            grid-template-columns: minmax(0, 1fr) minmax(0, 2fr);
            gap: 20px;
            align-items: start;
        }

        .profile-panel {
            padding: 26px 22px;
            background: linear-gradient(180deg, rgba(255,255,255,0.04), rgba(255,255,255,0.01));
            border: 1px solid var(--line);
            border-radius: 28px;
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.08), 0 12px 30px rgba(0,0,0,0.12);
        }

        .profile-panel h2 {
            margin: 0 0 18px;
            font-size: clamp(1.5rem, 2.4vw, 2.2rem);
            letter-spacing: -0.05em;
        }

        .detail-list {
            display: grid;
            gap: 14px;
            margin: 0;
        }

        .detail-list dt {
            font-size: 0.7rem;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--muted);
        }

        .detail-list dd {
            margin: 4px 0 0;
            font-weight: 600;
            overflow-wrap: anywhere;
        }

        .package-tag {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 999px;
            border: 1px solid var(--line);
            font-size: 0.72rem;
            letter-spacing: 0.1em;
        }

        .package-tag.premium {
            background: linear-gradient(135deg, #facc15, #f59e0b, #f97316);
            border-color: rgba(251,191,36,0.6);
            color: #1b1208;
        }

        .plan-summary {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 18px;
        }

        .plan-summary span {
            padding: 8px 12px;
            border: 1px solid var(--line);
            border-radius: 999px;
            background: var(--chip);
            font-size: 0.74rem;
            color: var(--muted);
        }

        .plan-text {
            color: var(--muted);
            line-height: 1.7;
            margin: 0 0 12px;
        }

        .session-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 14px;
            margin-top: 18px;
        }

        .session-grid .plan-card h3 {
            margin: 0 0 12px;
            font-size: 1.2rem;
            letter-spacing: -0.03em;
        }

        .plan-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: center;
            margin-top: 22px;
        }

        .plan-actions .generate-button {
            margin-top: 0;
        }

        .ghost-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(255,142,142,0.5);
            border-radius: 999px;
            background: transparent;
            color: #ff8e8e;
            padding: 15px 24px;
            font-size: 0.76rem;
            font-weight: 700;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            cursor: pointer;
            text-decoration: none;
        }

        .ghost-button:disabled {
            opacity: 0.6;
            cursor: wait;
        }

        .empty-plan p {
            color: var(--muted);
            line-height: 1.7;
            margin: 0 0 18px;
        }

        .empty-plan .generate-button {
            text-decoration: none;
        }

        @media (max-width: 860px) {
            .profile-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="page-shell nav">
            <div class="nav-left">
                <div class="account-wrap">
                    <button class="account-trigger" type="button" aria-label="Account menu">
                        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 12a4 4 0 1 0-4-4 4 4 0 0 0 4 4Zm0 2c-4.42 0-8 2.24-8 5v1h16v-1c0-2.76-3.58-5-8-5Z"/></svg>
                    </button>
                    <div class="account-menu">
                        <div class="account-name" id="accountName">Guest</div>
                        <button class="menu-btn profile-btn" type="button">Profile</button>
                        <button class="menu-btn upgrade-btn" type="button">Upgrade</button>
                        <button class="menu-btn login-btn" type="button">Log in</button>
                        <button class="menu-btn logout-btn" type="button">Log out</button>
                    </div>
                </div>

                <a href="index.html" class="brand" aria-label="Brotein home">
                    <img src="broteinlogo.png" alt="Brotein logo" class="brand-logo" />
                </a>
            </div>

            <nav class="nav-links" aria-label="Main navigation">
                <a href="index.html">Home</a>
                <a href="calculators.html">Calculators</a>
                <a href="plan.html">Plans</a>
                <a href="contact.html">Contact</a>
            </nav>

            <a href="plan.html" class="nav-cta">Workout Plan</a>
        </div>
    </header>

    <main class="page-shell">
        <section class="hero">
            <div class="eyebrow">Profile</div>
            <h1>Your profile</h1>
            <p class="subtitle">Your account details and your saved workout plan, all in one place.</p>
        </section>

        <div id="profileMessage" class="profile-panel" style="display:none; text-align:center;">
            <p id="profileMessageText" class="plan-text"></p>
            <a href="login.html" class="generate-button" style="text-decoration:none;">Log in</a>
        </div>

        <div id="profileContent" class="profile-grid" style="display:none;">
            <section class="profile-panel" aria-labelledby="account-heading">
                <h2 id="account-heading">Account</h2>
                <dl class="detail-list">
                    <div><dt>Name</dt><dd id="profileName"></dd></div>
                    <div><dt>Email</dt><dd id="profileEmail"></dd></div>
                    <div><dt>Package</dt><dd><span id="profilePackage" class="package-tag"></span></dd></div>
                    <div><dt>Member since</dt><dd id="profileJoined"></dd></div>
                </dl>
            </section>

            <section class="profile-panel" aria-labelledby="plan-heading">
                <h2 id="plan-heading">Your workout plan</h2>

                <div id="planEmpty" class="empty-plan" style="display:none;">
                    <p id="planEmptyText"></p>
                    <a id="planEmptyLink" href="plan.html" class="generate-button"></a>
                </div>

                <div id="planDetails" style="display:none;">
                    <div id="planSummary" class="plan-summary"></div>
                    <p id="planFocus" class="plan-text"></p>
                    <p id="planWeekly" class="plan-text"></p>
                    <p id="planNutrition" class="plan-text"></p>
                    <div id="planSessions" class="session-grid"></div>

                    <div class="plan-actions">
                        <button type="button" id="downloadPlanButton" class="generate-button">Download PDF</button>
                        <button type="button" id="deletePlanButton" class="ghost-button">Delete plan</button>
                    </div>
                    <a id="openPdfFallback" href="#" style="display:none; margin-top:12px; font-size:0.72rem; letter-spacing:0.08em; text-transform:uppercase; color:#dfe9ff; text-decoration:underline;" target="_blank" rel="noreferrer">Can't download? Open pdf</a>
                </div>

                <div id="planStatus" class="plan-status" aria-live="polite" role="status"></div>
            </section>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-client.js"></script>
    <script src="plan-builder.js"></script>
    <script>
        const CURRENT_USER_KEY = 'brotein_current_user';
        const db = window.broteinSupabase;
        let savedPlan = null;

        function getCurrentUser() {
            try {
                const user = JSON.parse(localStorage.getItem(CURRENT_USER_KEY) || 'null');
                return user && user.loggedIn ? user : null;
            } catch (error) {
                return null;
            }
        }

        function updateAccountMenu() {
            const user = getCurrentUser();
            const nameEl = document.getElementById('accountName');
            const loginBtn = document.querySelector('.login-btn');
            const logoutBtn = document.querySelector('.logout-btn');
            const upgradeBtn = document.querySelector('.upgrade-btn');

            if (!nameEl || !loginBtn || !logoutBtn) return;

            const profileBtn = document.querySelector('.profile-btn');
            if (profileBtn) profileBtn.style.display = user && !user.guest ? 'block' : 'none';

            const isGuest = !!user && user.guest === true;
            const packageName = (user && user.package) ? String(user.package).toUpperCase() : 'FREE';
            const isPremium = packageName === 'PREMIUM';
            nameEl.classList.toggle('premium-user', isPremium);

            if (isGuest) {
                nameEl.textContent = 'Guest';
                loginBtn.textContent = 'LOG IN';
                loginBtn.style.display = 'block';
                logoutBtn.style.display = 'none';
                if (upgradeBtn) {
                    upgradeBtn.style.display = 'none';
                }
                return;
            }

            if (user) {
                const displayName = user.name || 'User';
                nameEl.textContent = displayName;
                loginBtn.textContent = 'Log in';
                loginBtn.style.display = 'none';
                logoutBtn.style.display = 'block';
                if (upgradeBtn) {
                    upgradeBtn.style.display = isPremium ? 'none' : 'block';
                }
            } else {
                nameEl.textContent = 'Guest';
                loginBtn.textContent = 'LOG IN';
                loginBtn.style.display = 'block';
                logoutBtn.style.display = 'none';
                if (upgradeBtn) {
                    upgradeBtn.style.display = 'none';
                }
            }
        }

        document.querySelector('.login-btn')?.addEventListener('click', function () {
            window.location.href = 'login.html';
        });

        document.querySelector('.profile-btn')?.addEventListener('click', function () {
            window.location.href = 'profile.html';
        });

        document.querySelector('.upgrade-btn')?.addEventListener('click', function () {
            window.location.href = 'upgrade.html';
        });

        document.querySelector('.logout-btn')?.addEventListener('click', function () {
            localStorage.removeItem(CURRENT_USER_KEY);
            const signOut = window.broteinSupabase ? window.broteinSupabase.auth.signOut() : Promise.resolve();
            signOut.finally(() => window.location.reload());
        });

        document.querySelector('.account-trigger')?.addEventListener('click', function (event) {
            const accountWrap = this.closest('.account-wrap');
            if (!accountWrap) return;
            accountWrap.classList.toggle('is-open');
            event.stopPropagation();
        });

        document.addEventListener('click', function (event) {
            const accountWrap = document.querySelector('.account-wrap');
            if (accountWrap && !accountWrap.contains(event.target)) {
                accountWrap.classList.remove('is-open');
            }
        });

        function escapeHtml(value) {
            return String(value).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        function setPlanStatus(message, type = '') {
            const statusEl = document.getElementById('planStatus');
            statusEl.textContent = message;
            statusEl.className = 'plan-status';
            if (type) statusEl.classList.add(type);
        }

        function showProfileMessage(message) {
            document.getElementById('profileContent').style.display = 'none';
            document.getElementById('profileMessage').style.display = 'block';
            document.getElementById('profileMessageText').textContent = message;
        }

        function renderPlan(profile) {
            const empty = document.getElementById('planEmpty');
            const details = document.getElementById('planDetails');

            if (!savedPlan) {
                details.style.display = 'none';
                empty.style.display = 'block';
                const isPremium = String(profile?.package || 'FREE').toUpperCase() === 'PREMIUM';
                document.getElementById('planEmptyText').textContent = isPremium
                    ? 'You don\'t have a saved plan yet. Generate one and it will be kept here.'
                    : 'Workout plans are a Premium feature. Upgrade to generate your personal plan.';
                const link = document.getElementById('planEmptyLink');
                link.textContent = isPremium ? 'Generate a plan' : 'Upgrade';
                link.href = isPremium ? 'plan.html' : 'upgrade.html';
                return;
            }

            const plan = rowToPlan(savedPlan);
            const goalPlan = getGoalPlan(plan.goal, plan.days, plan.gender);

            empty.style.display = 'none';
            details.style.display = 'block';

            document.getElementById('planSummary').innerHTML = [
                goalPlan.label,
                `${plan.days} days / week`,
                plan.gender === 'female' ? 'Female' : 'Male',
                `${plan.weight.toFixed(1)} kg`,
                `${plan.height} cm`,
                `Age ${plan.age}`,
                `BMI ${getPlanBmi(plan).toFixed(1)}`,
                `Created ${new Date(savedPlan.created_at).toLocaleDateString()}`
            ].map((item) => `<span>${escapeHtml(item)}</span>`).join('');

            document.getElementById('planFocus').textContent = goalPlan.focus;
            document.getElementById('planWeekly').textContent = goalPlan.weekly;
            document.getElementById('planNutrition').textContent = goalPlan.nutrition;

            document.getElementById('planSessions').innerHTML = getPlanSessions(plan).map((session, index) => `
                <div class="plan-card">
                    <span class="day">Day ${index + 1}</span>
                    <h3>${escapeHtml(session.title)}</h3>
                    <ul>${session.exercises.map((exercise) => `<li>${escapeHtml(exercise)}</li>`).join('')}</ul>
                </div>
            `).join('');
        }

        async function loadProfile() {
            if (!db) {
                showProfileMessage('Could not connect to the server. Please try again later.');
                return;
            }

            const { data: { session } } = await db.auth.getSession();
            if (!session) {
                showProfileMessage('Log in with your account to see your profile and saved plan.');
                return;
            }

            const [{ data: profile }, { data: plan, error: planError }] = await Promise.all([
                db.from('profiles').select('name, email, package, created_at').eq('id', session.user.id).maybeSingle(),
                db.from('workout_plans').select('*').eq('user_id', session.user.id).maybeSingle()
            ]);

            const packageName = String(profile?.package || 'FREE').toUpperCase();
            document.getElementById('profileName').textContent = profile?.name || session.user.user_metadata?.name || 'User';
            document.getElementById('profileEmail').textContent = profile?.email || session.user.email;
            const packageEl = document.getElementById('profilePackage');
            packageEl.textContent = packageName;
            packageEl.classList.toggle('premium', packageName === 'PREMIUM');
            document.getElementById('profileJoined').textContent = profile?.created_at
                ? new Date(profile.created_at).toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' })
                : 'N/A';

            document.getElementById('profileMessage').style.display = 'none';
            document.getElementById('profileContent').style.display = 'grid';

            if (planError) {
                setPlanStatus('Could not load your plan: ' + planError.message, 'error');
            }
            savedPlan = plan || null;
            renderPlan(profile);
        }

        document.getElementById('downloadPlanButton').addEventListener('click', function () {
            if (!savedPlan) return;
            const plan = rowToPlan(savedPlan);
            try {
                const doc = createPlanPdf(plan, new Date(savedPlan.created_at));
                const pdfUrl = URL.createObjectURL(doc.output('blob'));
                try {
                    const link = document.createElement('a');
                    link.href = pdfUrl;
                    link.download = getPlanPdfFilename(plan);
                    link.style.display = 'none';
                    document.body.appendChild(link);
                    link.click();
                    link.remove();
                    setPlanStatus('PDF downloaded.', 'success');
                } catch (error) {
                    const fallback = document.getElementById('openPdfFallback');
                    fallback.href = pdfUrl;
                    fallback.style.display = 'inline-block';
                    setPlanStatus('Download blocked by your browser. Use the link below.', 'error');
                    return;
                }
                setTimeout(() => URL.revokeObjectURL(pdfUrl), 2000);
            } catch (error) {
                console.error('PDF generation failed:', error);
                setPlanStatus('Something went wrong. Please try again.', 'error');
            }
        });

        document.getElementById('deletePlanButton').addEventListener('click', async function () {
            if (!savedPlan) return;
            if (!confirm('Delete your workout plan? You can generate a new one afterwards.')) return;

            this.disabled = true;
            const { error } = await db.from('workout_plans').delete().eq('id', savedPlan.id);
            this.disabled = false;

            if (error) {
                setPlanStatus('Could not delete your plan: ' + error.message, 'error');
                return;
            }

            savedPlan = null;
            document.getElementById('openPdfFallback').style.display = 'none';
            const { data: profile } = await db.from('profiles').select('package').eq('id', (await db.auth.getSession()).data.session.user.id).maybeSingle();
            renderPlan(profile);
            setPlanStatus('Plan deleted. You can now generate a new one.', 'success');
        });

        updateAccountMenu();
        loadProfile();
    </script>
</body>
</html>
