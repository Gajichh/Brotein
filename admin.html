<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Brotein | Admin</title>
    <link rel="icon" type="image/x-icon" href="broteinico.ico">
    <style>
        :root {
            --bg: #0d0d0d;
            --panel: #151515;
            --line: rgba(255,255,255,0.1);
            --text: #f3f3f1;
            --muted: #b2b2ad;
            --danger: #ff9b9b;
            --success: #d9f99d;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(180deg, #070707 0%, var(--bg) 26%, #101010 100%);
            color: var(--text);
            overflow-x: hidden;
            -webkit-text-size-adjust: 100%;
        }

        .page-shell {
            width: min(1180px, calc(100% - 24px));
            max-width: 1180px;
            margin: 0 auto;
            padding: 48px 0 80px;
        }

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            margin-bottom: 24px;
        }

        h1 {
            margin: 0;
            font-size: clamp(2rem, 4vw, 3rem);
            letter-spacing: -0.05em;
        }

        .chip {
            display: inline-block;
            padding: 9px 14px;
            border: 1px solid var(--line);
            border-radius: 999px;
            color: var(--muted);
            font-size: 0.75rem;
            letter-spacing: 0.12em;
            text-transform: uppercase;
        }

        .panel {
            background: linear-gradient(180deg, rgba(255,255,255,0.04), rgba(255,255,255,0.01));
            border: 1px solid var(--line);
            border-radius: 24px;
            padding: 22px;
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.08);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            overflow: hidden;
        }

        th, td {
            text-align: left;
            padding: 14px 12px;
            border-bottom: 1px solid var(--line);
            vertical-align: top;
        }

        th {
            color: var(--muted);
            font-size: 0.72rem;
            letter-spacing: 0.12em;
            text-transform: uppercase;
        }

        .package-badge {
            display: inline-block;
            padding: 7px 10px;
            border-radius: 999px;
            background: rgba(255,255,255,0.06);
            border: 1px solid var(--line);
            font-size: 0.72rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }

        .remove-btn {
            border: 1px solid rgba(255,255,255,0.15);
            background: transparent;
            color: var(--text);
            border-radius: 999px;
            padding: 10px 14px;
            font-size: 0.7rem;
            font-weight: 700;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            cursor: pointer;
        }

        .remove-btn:hover {
            border-color: var(--danger);
            color: var(--danger);
        }

        .empty {
            padding: 18px 0 8px;
            color: var(--muted);
        }

        .secret {
            display: none;
        }

        @media (max-width: 700px) {
            .page-shell {
                width: min(100%, calc(100% - 18px));
            }

            .topbar {
                flex-direction: column;
                align-items: flex-start;
                margin-bottom: 18px;
            }

            table, thead, tbody, th, td, tr {
                display: block;
            }

            thead { display: none; }

            tr {
                border-bottom: 1px solid var(--line);
                padding: 12px 0;
            }

            td {
                border: 0;
                padding: 7px 0;
            }

            td::before {
                content: attr(data-label);
                display: block;
                color: var(--muted);
                font-size: 0.7rem;
                letter-spacing: 0.12em;
                text-transform: uppercase;
                margin-bottom: 4px;
            }
        }
    </style>
</head>
<body>
    <div class="page-shell">
        <div class="topbar">
            <h1>Admin</h1>
            <span class="chip">Single package: FREE</span>
        </div>

        <div class="panel">
            <table aria-label="Users table">
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Package</th>
                        <th>Joined</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="adminTableBody"></tbody>
            </table>
            <div id="emptyState" class="empty" style="display:none;">No accounts found.</div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-client.js"></script>
    <script>
        const db = window.broteinSupabase;

        function escapeHtml(value) {
            return String(value).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        function formatDate(dateString) {
            if (!dateString) return 'N/A';
            const date = new Date(dateString);
            if (Number.isNaN(date.getTime())) return 'N/A';
            return date.toLocaleDateString(undefined, {
                year: 'numeric',
                month: 'short',
                day: 'numeric'
            });
        }

        function showMessage(message) {
            document.getElementById('adminTableBody').innerHTML = '';
            const emptyState = document.getElementById('emptyState');
            emptyState.textContent = message;
            emptyState.style.display = 'block';
        }

        async function renderAdminTable() {
            if (!db) {
                showMessage('Could not connect to the server.');
                return;
            }

            const { data: { session } } = await db.auth.getSession();
            if (!session) {
                showMessage('Log in with an admin account to view users.');
                return;
            }

            const { data: isAdmin } = await db.rpc('is_admin');
            if (!isAdmin) {
                showMessage('This account does not have admin access.');
                return;
            }

            const { data: users, error } = await db
                .from('profiles')
                .select('id, name, email, package, created_at')
                .order('created_at', { ascending: true });

            if (error) {
                showMessage('Could not load users: ' + error.message);
                return;
            }

            const tbody = document.getElementById('adminTableBody');
            const emptyState = document.getElementById('emptyState');
            const chip = document.querySelector('.chip');

            if (chip) {
                const premiumCount = users.filter((user) => String(user.package || 'FREE').toUpperCase() === 'PREMIUM').length;
                const freeCount = users.length - premiumCount;
                chip.textContent = `Packages: ${premiumCount} PREMIUM / ${freeCount} FREE`;
            }

            if (!users.length) {
                showMessage('No accounts found.');
                return;
            }

            emptyState.style.display = 'none';
            tbody.innerHTML = users.map((user) => `
                <tr>
                    <td data-label="Name">${escapeHtml(user.name || 'Unknown')}</td>
                    <td data-label="Email">${escapeHtml(user.email || 'N/A')}</td>
                    <td data-label="Package"><span class="package-badge">${escapeHtml((user.package || 'FREE').toUpperCase())}</span></td>
                    <td data-label="Joined">${formatDate(user.created_at)}</td>
                    <td data-label="Action">
                        ${user.id === session.user.id
                            ? ''
                            : `<button class="remove-btn" type="button" data-id="${user.id}">Remove</button>`}
                    </td>
                </tr>
            `).join('');

            document.querySelectorAll('.remove-btn').forEach((button) => {
                button.addEventListener('click', async function () {
                    if (!confirm('Permanently delete this account?')) return;
                    this.disabled = true;
                    const { error } = await db.rpc('admin_delete_user', { target_id: this.dataset.id });
                    if (error) {
                        alert('Could not remove user: ' + error.message);
                        this.disabled = false;
                        return;
                    }
                    renderAdminTable();
                });
            });
        }

        renderAdminTable();
    </script>
</body>
</html>
