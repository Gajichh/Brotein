<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Brotein | Login</title>
    <meta name="description" content="Login or register for a Brotein account and continue to your training dashboard." />
    <link rel="icon" type="image/x-icon" href="broteinico.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #000000;
            --panel: #0f0f0f;
            --panel-alt: #151515;
            --text: #fafafa;
            --muted: #a3a3a3;
            --line: rgba(255,255,255,0.1);
            --chip: rgba(255,255,255,0.06);
            --success: #c5f23f;
            --danger: #ff6b6b;
        }

        * { box-sizing: border-box; }

        html, body {
            margin: 0;
            min-height: 100%;
            font-family: "Inter", sans-serif;
            background: linear-gradient(180deg, #000000 0%, var(--bg) 26%, #000000 100%);
            color: var(--text);
            overflow-x: hidden;
            -webkit-text-size-adjust: 100%;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        img {
            max-width: 100%;
            display: block;
        }

        .page-shell {
            width: min(1180px, calc(100% - 24px));
            max-width: 1180px;
            margin: 0 auto;
        }

        header {
            position: sticky;
            top: 0;
            z-index: 10;
            backdrop-filter: blur(16px);
            background: rgba(0, 0, 0, 0.8);
            border-bottom: 1px solid var(--line);
        }

        .nav {
            height: 76px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 18px;
        }

        .brand {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 0;
        }

        .brand-logo {
            display: block;
            width: 110px;
            height: auto;
            object-fit: contain;
            filter: brightness(1.05);
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 28px;
            font-size: 0.8rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--muted);
        }

        .nav-cta {
            border: 1px solid rgba(255,255,255,0.18);
            padding: 12px 18px;
            border-radius: 999px;
            font-size: 0.8rem;
            font-weight: 600;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            transition: all 0.2s ease;
            background: linear-gradient(180deg, rgba(255,255,255,0.04), rgba(255,255,255,0.01));
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.12), 0 6px 18px rgba(0,0,0,0.18);
        }

        .nav-cta:hover {
            background: var(--text);
            color: var(--bg);
        }

        main {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: calc(100vh - 76px);
            padding: 48px 0 80px;
        }

        .auth-shell {
            width: min(560px, 100%);
        }

        .logo-wrap {
            display: flex;
            justify-content: center;
            margin-bottom: 26px;
        }

        .center-logo {
            width: 220px;
            max-width: 72%;
            height: auto;
            object-fit: contain;
        }

        .auth-card {
            background: linear-gradient(180deg, rgba(255,255,255,0.04), rgba(255,255,255,0.01));
            border: 1px solid var(--line);
            border-radius: 30px;
            padding: 28px 22px 22px;
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.08), 0 12px 30px rgba(0,0,0,0.12);
        }

        .tab-row {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 10px;
            background: rgba(255,255,255,0.02);
            border: 1px solid var(--line);
            border-radius: 16px;
            padding: 6px;
            margin-bottom: 22px;
        }

        .tab-button {
            border: 0;
            background: transparent;
            color: var(--muted);
            border-radius: 12px;
            padding: 12px 10px;
            font: inherit;
            font-size: 0.8rem;
            font-weight: 700;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .tab-button.active {
            background: rgba(255,255,255,0.08);
            color: var(--text);
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.12);
        }

        .form-panel {
            display: none;
        }

        .form-panel.active {
            display: block;
        }

        .field {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 18px;
        }

        label {
            font-size: 0.72rem;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--muted);
        }

        input, button {
            font: inherit;
        }

        input {
            width: 100%;
            border-radius: 14px;
            border: 1px solid var(--line);
            background: rgba(255,255,255,0.04);
            color: var(--text);
            padding: 14px 14px;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
            color-scheme: dark;
            font-size: 16px;
        }

        input:focus {
            outline: none;
            border-color: rgba(255,255,255,0.28);
            box-shadow: 0 0 0 3px rgba(255,255,255,0.06);
        }

        .inline-btn, .submit-btn, .guest-btn {
            border: 1px solid rgba(255,255,255,0.18);
            border-radius: 999px;
            background: var(--text);
            color: var(--bg);
            padding: 14px 20px;
            font-size: 0.76rem;
            font-weight: 700;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            cursor: pointer;
            transition: transform 0.2s ease, background 0.35s ease, box-shadow 0.35s ease, color 0.35s ease, border-color 0.35s ease;
        }

        .submit-btn:hover, .guest-btn:hover, .inline-btn:hover {
            transform: translateY(-1px);
        }

        #registerForm {
            display: flex;
            flex-direction: column;
        }

        #registerForm .submit-btn {
            align-self: center;
            min-width: 200px;
        }

        .submit-btn.premium {
            background: linear-gradient(135deg, #d4f85e, #b9e82e);
            color: #0a0a0a;
            border-color: rgba(197,242,63,0.56);
            box-shadow: 0 12px 24px rgba(197,242,63,0.11);
            animation: premiumPulse 1.4s ease-in-out infinite alternate;
        }

        @keyframes premiumPulse {
            0% {
                box-shadow: 0 0 0 rgba(197,242,63,0.08), 0 10px 18px rgba(197,242,63,0.09);
                filter: saturate(1);
            }
            100% {
                box-shadow: 0 0 0 6px rgba(197,242,63,0.06), 0 18px 26px rgba(197,242,63,0.14);
                filter: saturate(1.2);
            }
        }

        .muted-link {
            display: inline-block;
            margin-top: 14px;
            color: var(--muted);
            font-size: 0.8rem;
            text-align: center;
            width: 100%;
        }

        .auth-status {
            min-height: 22px;
            margin-top: 10px;
            font-size: 0.82rem;
            color: var(--muted);
        }

        .auth-status.success {
            color: var(--success);
        }

        .auth-status.error {
            color: var(--danger);
        }

        .guest-row {
            margin-top: 20px;
            display: flex;
            justify-content: center;
        }

        .guest-btn {
            width: auto;
            padding: 0;
            border: 0;
            background: transparent;
            color: rgba(255,255,255,0.7);
            font-size: 0.72rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            font-weight: 400;
            text-decoration: none;
        }

        .guest-btn:hover {
            color: rgba(255,255,255,0.88);
            transform: none;
        }

        .plan-field {
            margin-bottom: 22px;
        }

        .plan-picker {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 12px;
        }

        .plan-option {
            position: relative;
            display: block;
            cursor: pointer;
        }

        .plan-option input {
            position: absolute;
            inset: 0;
            opacity: 0;
            pointer-events: none;
        }

        .plan-card {
            position: relative;
            display: flex;
            flex-direction: column;
            min-height: 230px;
            padding: 16px 14px 14px;
            border-radius: 20px;
            background: linear-gradient(180deg, rgba(255,255,255,0.03), rgba(255,255,255,0.01));
            border: 1px solid rgba(255,255,255,0.08);
            overflow: hidden;
            transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .plan-limited {
            margin-top: 0;
        }

        .plan-card::before {
            content: "";
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at top right, rgba(255,255,255,0.12), transparent 42%);
            opacity: 0;
            transition: opacity 0.2s ease;
            pointer-events: none;
        }

        .plan-option input:checked + .plan-card {
            border-color: rgba(255,255,255,0.28);
            box-shadow: 0 16px 28px rgba(0,0,0,0.18), 0 0 0 1px rgba(255,255,255,0.08);
            transform: translateY(-2px);
        }

        .plan-option input:checked + .plan-card::before {
            opacity: 1;
        }

        .plan-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }

        .plan-name {
            display: inline-block;
            font-size: 0.96rem;
            font-weight: 800;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .premium-card .plan-name {
            background: linear-gradient(135deg, #d4f85e, #b9e82e);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .plan-badge,
        .plan-price {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 7px 10px;
            border-radius: 999px;
            line-height: 1;
            font-size: 0.68rem;
            font-weight: 800;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            white-space: nowrap;
        }

        .plan-badge {
            background: rgba(255,255,255,0.07);
            color: var(--muted);
            border: 1px solid rgba(255,255,255,0.08);
        }

        .plan-price {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            margin-top: 16px;
            padding: 12px 14px;
            border-radius: 14px;
            background: linear-gradient(135deg, rgba(197,242,63,0.14), rgba(197,242,63,0.17));
            border: 1px solid rgba(197,242,63,0.54);
            color: #e6fba0;
            font-size: 0.8rem;
            font-weight: 900;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            box-shadow: 0 8px 18px rgba(197,242,63,0.09), inset 0 1px 0 rgba(255,255,255,0.12);
        }

        .plan-meta {
            display: block;
            margin-top: 10px;
            color: rgba(255,255,255,0.7);
            font-size: 0.72rem;
            letter-spacing: 0.04em;
        }

        .plan-list {
            list-style: none;
            display: grid;
            gap: 8px;
            margin: 14px 0 0;
            padding: 0;
            color: var(--muted);
            font-size: 0.75rem;
            line-height: 1.5;
        }

        .plan-list li {
            display: flex;
            align-items: flex-start;
            gap: 8px;
        }

        .plan-list li::before {
            content: "✓";
            color: #c5f23f;
            font-weight: 800;
            font-size: 0.8rem;
            line-height: 1.3;
            margin-top: 1px;
        }

        .plan-limited .plan-list li::before {
            content: "✕";
            color: rgba(255, 155, 155, 0.9);
        }

        .premium-card {
            border: 1px solid transparent;
            background: linear-gradient(180deg, rgba(15,15,15,0.96), rgba(15,15,15,0.96)) padding-box,
                linear-gradient(135deg, rgba(197,242,63,0.8), rgba(185,232,46,0.96), rgba(197,242,63,0.46)) border-box;
            background-clip: padding-box, border-box;
            background-origin: padding-box, border-box;
            box-shadow: inset 0 0 0 1px rgba(197,242,63,0.14);
        }

        .plan-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: fit-content;
            margin-top: 16px;
            padding: 10px 14px;
            border-radius: 999px;
            font-size: 0.7rem;
            font-weight: 800;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            border: 0;
            background: linear-gradient(135deg, #d4f85e, #b9e82e);
            color: #0a0a0a;
            box-shadow: 0 12px 24px rgba(197,242,63,0.1);
        }

        .plan-button svg {
            width: 14px;
            height: 14px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        @media (max-width: 820px) {
            .nav {
                height: auto;
                min-height: 76px;
                padding: 12px 0;
                gap: 10px;
                flex-wrap: wrap;
            }

            .nav-links {
                display: none;
            }

            .nav-cta {
                margin-left: auto;
            }
        }

        @media (max-width: 480px) {
            .page-shell {
                width: min(100%, calc(100% - 18px));
            }

            .nav {
                gap: 8px;
            }

            .auth-card {
                padding: 20px 16px 18px;
            }

            .center-logo {
                width: 180px;
            }

            .tab-row {
                gap: 8px;
            }

            .plan-picker {
                grid-template-columns: 1fr;
            }

            .plan-card {
                min-height: auto;
            }

            .submit-btn,
            .guest-btn {
                width: 100%;
            }

            .guest-btn {
                padding: 12px 14px;
            }
        }
    </style>
    <link rel="stylesheet" href="nav-menu.css" />
    <link rel="stylesheet" href="theme.css" />
</head>
<body>
    <div class="site-glow" aria-hidden="true"></div>
    <header>
        <div class="page-shell nav">
            <div class="nav-left">
                <div class="account-wrap">
                    <button class="account-trigger" type="button" aria-label="Account menu">
                        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 12a4 4 0 1 0-4-4 4 4 0 0 0 4 4Zm0 2c-4.42 0-8 2.24-8 5v1h16v-1c0-2.76-3.58-5-8-5Z"/></svg>
                    </button>
                    <div class="account-menu">
                        <div class="account-name" id="accountName">Guest</div>
                        <button class="menu-btn profile-btn" type="button">Profile</button>
                        <button class="menu-btn admin-btn" type="button">Admin panel</button>
                        <button class="menu-btn upgrade-btn" type="button">Upgrade</button>
                        <button class="menu-btn login-btn" type="button">Log in</button>
                        <button class="menu-btn logout-btn" type="button">Log out</button>
                    </div>
                </div>

                <a href="index.html" class="brand" aria-label="Brotein home">
                    <img src="broteinlogo.png" alt="Brotein logo" class="brand-logo" />
                </a>
            </div>

            <nav class="nav-links" aria-label="Main navigation">
                <a href="index.html">Home</a>
                <div class="tools-menu">
                    <button type="button" class="tools-trigger" aria-haspopup="true" aria-expanded="false">
                        All Tools
                        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
                    </button>
                    <div class="tools-dropdown">
                        <a href="gym-finder.html">
                            <span class="tools-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a7 7 0 0 0-7 7c0 5.25 7 13 7 13s7-7.75 7-13a7 7 0 0 0-7-7Zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5Z"/></svg></span>
                            <span class="tools-text"><strong>Gym Finder</strong><small>Gyms near you, open ones first</small></span>
                        </a>
                        <a href="calculators.html">
                            <span class="tools-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 2h10a2 2 0 0 1 2 2v16a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2Zm1 3v4h8V5H8Zm0 7v2h2v-2H8Zm3 0v2h2v-2h-2Zm3 0v2h2v-2h-2Zm-6 4v2h2v-2H8Zm3 0v2h2v-2h-2Zm3 0v2h2v-2h-2Z"/></svg></span>
                            <span class="tools-text"><strong>Calculators</strong><small>BMI and daily calories</small></span>
                        </a>
                        <a href="plan.html">
                            <span class="tools-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.57 14.86 22 13.43 20.57 12 17 15.57 8.43 7 12 3.43 10.57 2 9.14 3.43 7.71 2 5.57 4.14 4.14 2.71 2.71 4.14l1.43 1.43L2 7.71l1.43 1.43L2 10.57 3.43 12 7 8.43 15.57 17 12 20.57 13.43 22l1.43-1.43L16.29 22l2.14-2.14 1.43 1.43 1.43-1.43-1.43-1.43L22 16.29l-1.43-1.43Z"/></svg></span>
                            <span class="tools-text"><strong>Workout Plans</strong><small>Your personal training plan</small></span>
                        </a>
                        <a href="food-plan.html">
                            <span class="tools-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="16" cy="8" r="5.6"/><path d="M14.1 11.6 7.9 17.8l1.5 1.5 6.2-6.2z"/><circle cx="10.4" cy="20.1" r="2.2"/><circle cx="6.9" cy="16.6" r="2.2"/></svg></span>
                            <span class="tools-text"><strong>Food Plans</strong><small>Calories and weekly nutrition</small></span>
                        </a>
                        <a href="calendar.html">
                            <span class="tools-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 2v2H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2h-2V2h-2v2H9V2H7Zm12 6H5v12h14V8ZM7 11h3v3H7v-3Z"/></svg></span>
                            <span class="tools-text"><strong>Calendar</strong><small>This week's plan at a glance</small></span>

                    </div>
                </div>
                <a href="collaborations.html">Collaborations</a>
                <a href="contact.html">Contact</a>
            </nav>

            <a href="pricing.html" class="nav-cta"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.6 13.4 13.4 20.6a2 2 0 0 1-2.8 0L3 13V3h10l7.6 7.6a2 2 0 0 1 0 2.8ZM7.5 9A1.5 1.5 0 1 0 7.5 6a1.5 1.5 0 0 0 0 3Z"/></svg>Pricing</a>
        </div>
    </header>

    <main>
        <div class="auth-shell">
            <div class="logo-wrap">
                <img src="broteinlogo.png" alt="Brotein logo" class="center-logo" />
            </div>

            <div class="auth-card">
                <div class="tab-row" role="tablist" aria-label="Authentication tabs">
                    <button class="tab-button active" type="button" data-tab="login" aria-selected="true">Login</button>
                    <button class="tab-button" type="button" data-tab="register" aria-selected="false">Register</button>
                </div>

                <div id="loginPanel" class="form-panel active">
                    <form id="loginForm">
                        <div class="field">
                            <label for="loginEmail">Email</label>
                            <input id="loginEmail" name="loginEmail" type="email" placeholder="you@example.com" required />
                        </div>

                        <div class="field">
                            <label for="loginPassword">Password</label>
                            <input id="loginPassword" name="loginPassword" type="password" placeholder="Enter your password" required />
                        </div>

                        <button type="submit" class="submit-btn">Log in</button>
                    </form>
                </div>

                <div id="registerPanel" class="form-panel">
                    <form id="registerForm">
                        <div class="field">
                            <label for="registerName">Full name</label>
                            <input id="registerName" name="registerName" type="text" placeholder="Your name" required />
                        </div>

                        <div class="field">
                            <label for="registerEmail">Email</label>
                            <input id="registerEmail" name="registerEmail" type="email" placeholder="you@example.com" required />
                        </div>

                        <div class="field">
                            <label for="registerPassword">Password</label>
                            <input id="registerPassword" name="registerPassword" type="password" placeholder="Create a password" required />
                        </div>

                        <div class="field">
                            <label for="registerConfirmPassword">Confirm password</label>
                            <input id="registerConfirmPassword" name="registerConfirmPassword" type="password" placeholder="Repeat your password" required />
                        </div>

                        <div class="field plan-field">
                            <label>Choose your plan</label>
                            <div class="plan-picker" role="radiogroup" aria-label="Choose your plan">
                                <label class="plan-option">
                                    <input type="radio" name="planType" value="FREE" checked />
                                    <span class="plan-card">
                                        <span class="plan-top">
                                            <span class="plan-name">Free</span>
                                            <span class="plan-badge">Included</span>
                                        </span>
                                        <span class="plan-meta">Starter access</span>
                                        <ul class="plan-list">
                                            <li>BMI calculator</li>
                                            <li>Calorie intake tools</li>
                                            <li>Basic fitness tracking</li>
                                        </ul>

                                        <div class="plan-limited">
                                            <ul class="plan-list">
                                                <li>Unlimited workout plans</li>
                                                <li>Premium custom routines</li>
                                                <li>Full premium access</li>
                                            </ul>
                                        </div>
                                    </span>
                                </label>

                                <label class="plan-option">
                                    <input type="radio" name="planType" value="PREMIUM" />
                                    <span class="plan-card premium-card">
                                        <span class="plan-top">
                                            <span class="plan-name">Premium</span>
                                        </span>
                                        <span class="plan-meta">Best for serious progress</span>
                                        <ul class="plan-list">
                                            <li>Unlimited workout plan generation</li>
                                            <li>BMI calculator</li>
                                            <li>Calorie intake tools</li>
                                            <li>Basic fitness tracking</li>
                                            <li>Full access to premium features</li>
                                        </ul>
                                        <span class="plan-price" aria-label="Price: only 0.99 dollars">ONLY 0.99$</span>
                                    </span>
                                </label>
                            </div>
                        </div>

                        <button type="submit" id="registerSubmitButton" class="submit-btn">Create account</button>
                    </form>
                </div>

                <div class="guest-row">
                    <button type="button" id="guestLogin" class="guest-btn">Continue as guest</button>
                </div>

                <div id="authStatus" class="auth-status" aria-live="polite"></div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-client.js"></script>
    <script>
        const CURRENT_USER_KEY = 'brotein_current_user';
        const db = window.broteinSupabase;

        function setStatus(message, type = '') {
            const statusEl = document.getElementById('authStatus');
            statusEl.textContent = message;
            statusEl.className = 'auth-status';
            if (type) statusEl.classList.add(type);
        }

        function updateRegisterButtonState() {
            const submitButton = document.getElementById('registerSubmitButton');
            const selectedPlan = document.querySelector('input[name="planType"]:checked')?.value || 'FREE';

            if (!submitButton) return;

            const isPremium = selectedPlan === 'PREMIUM';
            submitButton.classList.toggle('premium', isPremium);
            submitButton.textContent = isPremium ? 'Subscribe' : 'Create account';
        }

        function switchTab(tabName) {
            const loginPanel = document.getElementById('loginPanel');
            const registerPanel = document.getElementById('registerPanel');
            const tabs = document.querySelectorAll('.tab-button');

            const isLogin = tabName === 'login';
            loginPanel.classList.toggle('active', isLogin);
            registerPanel.classList.toggle('active', !isLogin);

            tabs.forEach((tab) => {
                const active = tab.dataset.tab === tabName;
                tab.classList.toggle('active', active);
                tab.setAttribute('aria-selected', active ? 'true' : 'false');
            });

            setStatus('');
        }

        function setBusy(form, busy) {
            form.querySelector('.submit-btn').disabled = busy;
        }

        // Loads the profile row for a signed-in Supabase user and marks them as the current user.
        async function saveCurrentUser(authUser) {
            const { data: profile } = await db
                .from('profiles')
                .select('name, package, is_admin, weight, weight_unit, height, age, gender')
                .eq('id', authUser.id)
                .maybeSingle();

            const existingUser = (() => {
                try {
                    const raw = JSON.parse(localStorage.getItem(CURRENT_USER_KEY) || 'null');
                    return raw && raw.loggedIn ? raw : {};
                } catch (error) {
                    return {};
                }
            })();

            const savedProfile = {
                weight: profile?.weight ?? existingUser.profile?.weight ?? '',
                weightUnit: profile?.weight_unit ?? existingUser.profile?.weightUnit ?? 'kg',
                height: profile?.height ?? existingUser.profile?.height ?? '',
                age: profile?.age ?? existingUser.profile?.age ?? '',
                gender: profile?.gender ?? existingUser.profile?.gender ?? 'male'
            };

            localStorage.setItem(CURRENT_USER_KEY, JSON.stringify({
                name: profile?.name || authUser.user_metadata?.name || 'User',
                email: authUser.email,
                package: profile?.package || existingUser.package || 'FREE',
                profile: savedProfile,
                isAdmin: Boolean(profile?.is_admin),
                guest: false,
                loggedIn: true
            }));
        }

        document.querySelectorAll('.tab-button').forEach((button) => {
            button.addEventListener('click', () => switchTab(button.dataset.tab));
        });

        document.querySelectorAll('input[name="planType"]').forEach((radio) => {
            radio.addEventListener('change', updateRegisterButtonState);
        });

        updateRegisterButtonState();

        document.getElementById('registerForm').addEventListener('submit', async function (event) {
            event.preventDefault();

            const name = document.getElementById('registerName').value.trim();
            const email = document.getElementById('registerEmail').value.trim();
            const password = document.getElementById('registerPassword').value;
            const confirmPassword = document.getElementById('registerConfirmPassword').value;
            const selectedPlan = document.querySelector('input[name="planType"]:checked')?.value || 'FREE';

            if (!name || !email || !password || !confirmPassword) {
                setStatus('Please fill in all fields.', 'error');
                return;
            }

            if (password.length < 6) {
                setStatus('Password must be at least 6 characters.', 'error');
                return;
            }

            if (password !== confirmPassword) {
                setStatus('Passwords do not match.', 'error');
                return;
            }

            if (!db) {
                setStatus('Could not connect to the server. Please try again later.', 'error');
                return;
            }

            setBusy(this, true);
            const { data, error } = await db.auth.signUp({
                email,
                password,
                options: { data: { name, package: selectedPlan } }
            });

            if (error) {
                setBusy(this, false);
                setStatus(error.message, 'error');
                return;
            }

            // Supabase returns a user with no identities when the email is already registered.
            if (data.user && data.user.identities && data.user.identities.length === 0) {
                setBusy(this, false);
                setStatus('An account with that email already exists.', 'error');
                return;
            }

            // Email confirmation is off: the user is signed in straight away.
            if (data.session) {
                await saveCurrentUser(data.user);
                setStatus(selectedPlan === 'PREMIUM' ? 'Premium registration successful. Redirecting...' : 'Registration successful. Redirecting...', 'success');
                window.location.href = 'index.html';
                return;
            }

            setBusy(this, false);
            this.reset();
            updateRegisterButtonState();
            switchTab('login');
            setStatus('Registration successful. Check your email to confirm your account, then log in.', 'success');
        });

        document.getElementById('loginForm').addEventListener('submit', async function (event) {
            event.preventDefault();

            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value;

            if (!email || !password) {
                setStatus('Enter your email and password.', 'error');
                return;
            }

            if (!db) {
                setStatus('Could not connect to the server. Please try again later.', 'error');
                return;
            }

            setBusy(this, true);
            const { data, error } = await db.auth.signInWithPassword({ email, password });

            if (error) {
                setBusy(this, false);
                setStatus(error.message === 'Invalid login credentials' ? 'Incorrect email or password.' : error.message, 'error');
                return;
            }

            await saveCurrentUser(data.user);
            setStatus('Login successful. Redirecting...', 'success');
            window.location.href = 'index.html';
        });

        document.getElementById('guestLogin').addEventListener('click', async function () {
            if (db) await db.auth.signOut();
            localStorage.setItem(CURRENT_USER_KEY, JSON.stringify({
                name: 'Guest',
                email: 'guest@brotein.com',
                package: 'FREE',
                profile: {},
                guest: true,
                loggedIn: true
            }));

            setStatus('Continuing as guest...', 'success');
            window.location.href = 'index.html';
        });
    </script>
    <script src="nav-menu.js"></script>
    <script src="account-menu.js"></script>
</body>
</html>
