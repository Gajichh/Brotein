<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Brotein | Login</title>
    <meta name="description" content="Login or register for a Brotein account and continue to your training dashboard." />
    <link rel="icon" type="image/x-icon" href="broteinico.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0d0d0d;
            --panel: #151515;
            --panel-alt: #1b1b1b;
            --text: #f3f3f1;
            --muted: #b2b2ad;
            --line: rgba(255,255,255,0.1);
            --chip: rgba(255,255,255,0.06);
            --success: #d9f99d;
            --danger: #ff9b9b;
        }

        * { box-sizing: border-box; }

        html, body {
            margin: 0;
            min-height: 100%;
            font-family: "Inter", sans-serif;
            background: linear-gradient(180deg, #070707 0%, var(--bg) 26%, #101010 100%);
            color: var(--text);
            overflow-x: hidden;
            -webkit-text-size-adjust: 100%;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        img {
            max-width: 100%;
            display: block;
        }

        .page-shell {
            width: min(1180px, calc(100% - 24px));
            max-width: 1180px;
            margin: 0 auto;
        }

        header {
            position: sticky;
            top: 0;
            z-index: 10;
            backdrop-filter: blur(16px);
            background: rgba(13, 13, 13, 0.7);
            border-bottom: 1px solid var(--line);
        }

        .nav {
            height: 76px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 18px;
        }

        .brand {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 0;
        }

        .brand-logo {
            display: block;
            width: 110px;
            height: auto;
            object-fit: contain;
            filter: brightness(1.05);
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 28px;
            font-size: 0.8rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--muted);
        }

        .nav-cta {
            border: 1px solid rgba(255,255,255,0.18);
            padding: 12px 18px;
            border-radius: 999px;
            font-size: 0.8rem;
            font-weight: 600;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            transition: all 0.2s ease;
            background: linear-gradient(180deg, rgba(255,255,255,0.04), rgba(255,255,255,0.01));
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.12), 0 6px 18px rgba(0,0,0,0.18);
        }

        .nav-cta:hover {
            background: var(--text);
            color: var(--bg);
        }

        main {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: calc(100vh - 76px);
            padding: 48px 0 80px;
        }

        .auth-shell {
            width: min(560px, 100%);
        }

        .logo-wrap {
            display: flex;
            justify-content: center;
            margin-bottom: 26px;
        }

        .center-logo {
            width: 220px;
            max-width: 72%;
            height: auto;
            object-fit: contain;
        }

        .auth-card {
            background: linear-gradient(180deg, rgba(255,255,255,0.04), rgba(255,255,255,0.01));
            border: 1px solid var(--line);
            border-radius: 30px;
            padding: 28px 22px 22px;
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.08), 0 12px 30px rgba(0,0,0,0.12);
        }

        .tab-row {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 10px;
            background: rgba(255,255,255,0.02);
            border: 1px solid var(--line);
            border-radius: 16px;
            padding: 6px;
            margin-bottom: 22px;
        }

        .tab-button {
            border: 0;
            background: transparent;
            color: var(--muted);
            border-radius: 12px;
            padding: 12px 10px;
            font: inherit;
            font-size: 0.8rem;
            font-weight: 700;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .tab-button.active {
            background: rgba(255,255,255,0.08);
            color: var(--text);
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.12);
        }

        .form-panel {
            display: none;
        }

        .form-panel.active {
            display: block;
        }

        .field {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 18px;
        }

        label {
            font-size: 0.72rem;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--muted);
        }

        input, button {
            font: inherit;
        }

        input {
            width: 100%;
            border-radius: 14px;
            border: 1px solid var(--line);
            background: rgba(255,255,255,0.04);
            color: var(--text);
            padding: 14px 14px;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
            color-scheme: dark;
            font-size: 16px;
        }

        input:focus {
            outline: none;
            border-color: rgba(255,255,255,0.28);
            box-shadow: 0 0 0 3px rgba(255,255,255,0.06);
        }

        .inline-btn, .submit-btn, .guest-btn {
            border: 1px solid rgba(255,255,255,0.18);
            border-radius: 999px;
            background: var(--text);
            color: var(--bg);
            padding: 14px 20px;
            font-size: 0.76rem;
            font-weight: 700;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            cursor: pointer;
            transition: transform 0.2s ease, background 0.35s ease, box-shadow 0.35s ease, color 0.35s ease, border-color 0.35s ease;
        }

        .submit-btn:hover, .guest-btn:hover, .inline-btn:hover {
            transform: translateY(-1px);
        }

        #registerForm {
            display: flex;
            flex-direction: column;
        }

        #registerForm .submit-btn {
            align-self: center;
            min-width: 200px;
        }

        .submit-btn.premium {
            background: linear-gradient(135deg, #facc15, #f59e0b, #f97316);
            color: #1b1208;
            border-color: rgba(251,191,36,0.7);
            box-shadow: 0 12px 24px rgba(249,115,22,0.22);
            animation: premiumPulse 1.4s ease-in-out infinite alternate;
        }

        @keyframes premiumPulse {
            0% {
                box-shadow: 0 0 0 rgba(251,191,36,0.1), 0 10px 18px rgba(249,115,22,0.18);
                filter: saturate(1);
            }
            100% {
                box-shadow: 0 0 0 6px rgba(251,191,36,0.08), 0 18px 26px rgba(249,115,22,0.28);
                filter: saturate(1.2);
            }
        }

        .muted-link {
            display: inline-block;
            margin-top: 14px;
            color: var(--muted);
            font-size: 0.8rem;
            text-align: center;
            width: 100%;
        }

        .auth-status {
            min-height: 22px;
            margin-top: 10px;
            font-size: 0.82rem;
            color: var(--muted);
        }

        .auth-status.success {
            color: var(--success);
        }

        .auth-status.error {
            color: var(--danger);
        }

        .guest-row {
            margin-top: 20px;
            display: flex;
            justify-content: center;
        }

        .guest-btn {
            width: auto;
            padding: 0;
            border: 0;
            background: transparent;
            color: rgba(255,255,255,0.7);
            font-size: 0.72rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            font-weight: 400;
            text-decoration: none;
        }

        .guest-btn:hover {
            color: rgba(255,255,255,0.88);
            transform: none;
        }

        .plan-field {
            margin-bottom: 22px;
        }

        .plan-picker {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 12px;
        }

        .plan-option {
            position: relative;
            display: block;
            cursor: pointer;
        }

        .plan-option input {
            position: absolute;
            inset: 0;
            opacity: 0;
            pointer-events: none;
        }

        .plan-card {
            position: relative;
            display: flex;
            flex-direction: column;
            min-height: 230px;
            padding: 16px 14px 14px;
            border-radius: 20px;
            background: linear-gradient(180deg, rgba(255,255,255,0.03), rgba(255,255,255,0.01));
            border: 1px solid rgba(255,255,255,0.08);
            overflow: hidden;
            transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .plan-limited {
            margin-top: 0;
        }

        .plan-card::before {
            content: "";
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at top right, rgba(255,255,255,0.12), transparent 42%);
            opacity: 0;
            transition: opacity 0.2s ease;
            pointer-events: none;
        }

        .plan-option input:checked + .plan-card {
            border-color: rgba(255,255,255,0.28);
            box-shadow: 0 16px 28px rgba(0,0,0,0.18), 0 0 0 1px rgba(255,255,255,0.08);
            transform: translateY(-2px);
        }

        .plan-option input:checked + .plan-card::before {
            opacity: 1;
        }

        .plan-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }

        .plan-name {
            display: inline-block;
            font-size: 0.96rem;
            font-weight: 800;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .premium-card .plan-name {
            background: linear-gradient(135deg, #facc15, #f59e0b, #f97316);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .plan-badge,
        .plan-price {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 7px 10px;
            border-radius: 999px;
            line-height: 1;
            font-size: 0.68rem;
            font-weight: 800;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            white-space: nowrap;
        }

        .plan-badge {
            background: rgba(255,255,255,0.07);
            color: var(--muted);
            border: 1px solid rgba(255,255,255,0.08);
        }

        .plan-price {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            margin-top: 16px;
            padding: 12px 14px;
            border-radius: 14px;
            background: linear-gradient(135deg, rgba(251,191,36,0.18), rgba(249,115,22,0.34));
            border: 1px solid rgba(251,191,36,0.68);
            color: #fef3c7;
            font-size: 0.8rem;
            font-weight: 900;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            box-shadow: 0 8px 18px rgba(249,115,22,0.18), inset 0 1px 0 rgba(255,255,255,0.12);
        }

        .plan-meta {
            display: block;
            margin-top: 10px;
            color: rgba(255,255,255,0.7);
            font-size: 0.72rem;
            letter-spacing: 0.04em;
        }

        .plan-list {
            list-style: none;
            display: grid;
            gap: 8px;
            margin: 14px 0 0;
            padding: 0;
            color: var(--muted);
            font-size: 0.75rem;
            line-height: 1.5;
        }

        .plan-list li {
            display: flex;
            align-items: flex-start;
            gap: 8px;
        }

        .plan-list li::before {
            content: "✓";
            color: #4ade80;
            font-weight: 800;
            font-size: 0.8rem;
            line-height: 1.3;
            margin-top: 1px;
        }

        .plan-limited .plan-list li::before {
            content: "✕";
            color: rgba(255, 155, 155, 0.9);
        }

        .premium-card {
            border: 1px solid transparent;
            background: linear-gradient(180deg, rgba(16,16,16,0.96), rgba(16,16,16,0.96)) padding-box,
                linear-gradient(135deg, rgba(251,191,36,1), rgba(245,158,11,0.96), rgba(249,115,22,0.92)) border-box;
            background-clip: padding-box, border-box;
            background-origin: padding-box, border-box;
            box-shadow: inset 0 0 0 1px rgba(251,191,36,0.18);
        }

        .plan-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: fit-content;
            margin-top: 16px;
            padding: 10px 14px;
            border-radius: 999px;
            font-size: 0.7rem;
            font-weight: 800;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            border: 0;
            background: linear-gradient(135deg, #facc15, #f59e0b, #f97316);
            color: #1b1208;
            box-shadow: 0 12px 24px rgba(249,115,22,0.2);
        }

        .plan-button svg {
            width: 14px;
            height: 14px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        @media (max-width: 820px) {
            .nav {
                height: auto;
                min-height: 76px;
                padding: 12px 0;
                gap: 10px;
                flex-wrap: wrap;
            }

            .nav-links {
                display: none;
            }

            .nav-cta {
                margin-left: auto;
            }
        }

        @media (max-width: 480px) {
            .page-shell {
                width: min(100%, calc(100% - 18px));
            }

            .nav {
                gap: 8px;
            }

            .auth-card {
                padding: 20px 16px 18px;
            }

            .center-logo {
                width: 180px;
            }

            .tab-row {
                gap: 8px;
            }

            .plan-picker {
                grid-template-columns: 1fr;
            }

            .plan-card {
                min-height: auto;
            }

            .submit-btn,
            .guest-btn {
                width: 100%;
            }

            .guest-btn {
                padding: 12px 14px;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="page-shell nav">
            <a href="index.html" class="brand" aria-label="Brotein home">
                <img src="broteinlogo.png" alt="Brotein logo" class="brand-logo" />
            </a>

            <nav class="nav-links" aria-label="Main navigation">
                <a href="index.html">Home</a>
                <a href="calculators.html">Calculators</a>
                <a href="plan.html">Plans</a>
                <a href="contact.html">Contact</a>
            </nav>

            <a href="login.html" class="nav-cta">Login</a>
        </div>
    </header>

    <main>
        <div class="auth-shell">
            <div class="logo-wrap">
                <img src="broteinlogo.png" alt="Brotein logo" class="center-logo" />
            </div>

            <div class="auth-card">
                <div class="tab-row" role="tablist" aria-label="Authentication tabs">
                    <button class="tab-button active" type="button" data-tab="login" aria-selected="true">Login</button>
                    <button class="tab-button" type="button" data-tab="register" aria-selected="false">Register</button>
                </div>

                <div id="loginPanel" class="form-panel active">
                    <form id="loginForm">
                        <div class="field">
                            <label for="loginEmail">Email or username</label>
                            <input id="loginEmail" name="loginEmail" type="text" placeholder="you@example.com" required />
                        </div>

                        <div class="field">
                            <label for="loginPassword">Password</label>
                            <input id="loginPassword" name="loginPassword" type="password" placeholder="Enter your password" required />
                        </div>

                        <button type="submit" class="submit-btn">Log in</button>
                    </form>
                </div>

                <div id="registerPanel" class="form-panel">
                    <form id="registerForm">
                        <div class="field">
                            <label for="registerName">Full name</label>
                            <input id="registerName" name="registerName" type="text" placeholder="Your name" required />
                        </div>

                        <div class="field">
                            <label for="registerEmail">Email</label>
                            <input id="registerEmail" name="registerEmail" type="email" placeholder="you@example.com" required />
                        </div>

                        <div class="field">
                            <label for="registerPassword">Password</label>
                            <input id="registerPassword" name="registerPassword" type="password" placeholder="Create a password" required />
                        </div>

                        <div class="field">
                            <label for="registerConfirmPassword">Confirm password</label>
                            <input id="registerConfirmPassword" name="registerConfirmPassword" type="password" placeholder="Repeat your password" required />
                        </div>

                        <div class="field plan-field">
                            <label>Choose your plan</label>
                            <div class="plan-picker" role="radiogroup" aria-label="Choose your plan">
                                <label class="plan-option">
                                    <input type="radio" name="planType" value="FREE" checked />
                                    <span class="plan-card">
                                        <span class="plan-top">
                                            <span class="plan-name">Free</span>
                                            <span class="plan-badge">Included</span>
                                        </span>
                                        <span class="plan-meta">Starter access</span>
                                        <ul class="plan-list">
                                            <li>BMI calculator</li>
                                            <li>Calorie intake tools</li>
                                            <li>Basic fitness tracking</li>
                                        </ul>

                                        <div class="plan-limited">
                                            <ul class="plan-list">
                                                <li>Unlimited workout plans</li>
                                                <li>Premium custom routines</li>
                                                <li>Full premium access</li>
                                            </ul>
                                        </div>
                                    </span>
                                </label>

                                <label class="plan-option">
                                    <input type="radio" name="planType" value="PREMIUM" />
                                    <span class="plan-card premium-card">
                                        <span class="plan-top">
                                            <span class="plan-name">Premium</span>
                                        </span>
                                        <span class="plan-meta">Best for serious progress</span>
                                        <ul class="plan-list">
                                            <li>Unlimited workout plan generation</li>
                                            <li>BMI calculator</li>
                                            <li>Calorie intake tools</li>
                                            <li>Basic fitness tracking</li>
                                            <li>Full access to premium features</li>
                                        </ul>
                                        <span class="plan-price" aria-label="Price: only 0.99 dollars">ONLY 0.99$</span>
                                    </span>
                                </label>
                            </div>
                        </div>

                        <button type="submit" id="registerSubmitButton" class="submit-btn">Create account</button>
                    </form>
                </div>

                <div class="guest-row">
                    <button type="button" id="guestLogin" class="guest-btn">Continue as guest</button>
                </div>

                <div id="authStatus" class="auth-status" aria-live="polite"></div>
            </div>
        </div>
    </main>

    <script>
        const USERS_KEY = 'brotein_users';
        const CURRENT_USER_KEY = 'brotein_current_user';

        function readUsers() {
            try {
                const stored = localStorage.getItem(USERS_KEY);
                const users = stored ? JSON.parse(stored) : [];
                return users.map((user) => ({
                    name: user.name || 'Unknown',
                    email: user.email || '',
                    password: user.password || '',
                    package: user.package || 'FREE',
                    createdAt: user.createdAt || new Date().toISOString()
                }));
            } catch (error) {
                return [];
            }
        }

        function writeUsers(users) {
            localStorage.setItem(USERS_KEY, JSON.stringify(users));
        }

        function setStatus(message, type = '') {
            const statusEl = document.getElementById('authStatus');
            statusEl.textContent = message;
            statusEl.className = 'auth-status';
            if (type) statusEl.classList.add(type);
        }

        function updateRegisterButtonState() {
            const submitButton = document.getElementById('registerSubmitButton');
            const selectedPlan = document.querySelector('input[name="planType"]:checked')?.value || 'FREE';

            if (!submitButton) return;

            const isPremium = selectedPlan === 'PREMIUM';
            submitButton.classList.toggle('premium', isPremium);
            submitButton.textContent = isPremium ? 'Subscribe' : 'Create account';
        }

        function switchTab(tabName) {
            const loginPanel = document.getElementById('loginPanel');
            const registerPanel = document.getElementById('registerPanel');
            const tabs = document.querySelectorAll('.tab-button');

            const isLogin = tabName === 'login';
            loginPanel.classList.toggle('active', isLogin);
            registerPanel.classList.toggle('active', !isLogin);

            tabs.forEach((tab) => {
                const active = tab.dataset.tab === tabName;
                tab.classList.toggle('active', active);
                tab.setAttribute('aria-selected', active ? 'true' : 'false');
            });

            setStatus('');
        }

        document.querySelectorAll('.tab-button').forEach((button) => {
            button.addEventListener('click', () => switchTab(button.dataset.tab));
        });

        document.querySelectorAll('input[name="planType"]').forEach((radio) => {
            radio.addEventListener('change', updateRegisterButtonState);
        });

        updateRegisterButtonState();

        document.getElementById('registerForm').addEventListener('submit', function (event) {
            event.preventDefault();

            const name = document.getElementById('registerName').value.trim();
            const email = document.getElementById('registerEmail').value.trim();
            const password = document.getElementById('registerPassword').value;
            const confirmPassword = document.getElementById('registerConfirmPassword').value;
            const selectedPlan = document.querySelector('input[name="planType"]:checked')?.value || 'FREE';

            if (!name || !email || !password || !confirmPassword) {
                setStatus('Please fill in all fields.', 'error');
                return;
            }

            if (password.length < 6) {
                setStatus('Password must be at least 6 characters.', 'error');
                return;
            }

            if (password !== confirmPassword) {
                setStatus('Passwords do not match.', 'error');
                return;
            }

            const users = readUsers();
            const existingUser = users.find((user) => user.email.toLowerCase() === email.toLowerCase());

            if (existingUser) {
                setStatus('An account with that email already exists.', 'error');
                return;
            }

            users.push({
                name,
                email,
                password,
                package: selectedPlan,
                createdAt: new Date().toISOString()
            });

            writeUsers(users);

            if (selectedPlan === 'PREMIUM') {
                const premiumUser = {
                    name,
                    email,
                    package: 'PREMIUM',
                    guest: false,
                    loggedIn: true
                };

                localStorage.setItem(CURRENT_USER_KEY, JSON.stringify(premiumUser));
                setStatus('Premium registration successful. Redirecting...', 'success');
                window.location.href = 'index.html';
                return;
            }

            setStatus('Registration successful. You can now log in.', 'success');
            document.getElementById('registerForm').reset();
            switchTab('login');
        });

        document.getElementById('loginForm').addEventListener('submit', function (event) {
            event.preventDefault();

            const loginInput = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value;

            if (!loginInput || !password) {
                setStatus('Enter your email/username and password.', 'error');
                return;
            }

            const users = readUsers();
            const user = users.find((entry) =>
                (entry.email && entry.email.toLowerCase() === loginInput.toLowerCase()) ||
                (entry.name && entry.name.toLowerCase() === loginInput.toLowerCase())
            );

            if (!user || user.password !== password) {
                setStatus('Incorrect email or password.', 'error');
                return;
            }

            localStorage.setItem(CURRENT_USER_KEY, JSON.stringify({
                name: user.name,
                email: user.email,
                package: user.package || 'FREE',
                guest: false,
                loggedIn: true
            }));

            setStatus('Login successful. Redirecting...', 'success');
            window.location.href = 'index.html';
        });

        document.getElementById('guestLogin').addEventListener('click', function () {
            localStorage.setItem(CURRENT_USER_KEY, JSON.stringify({
                name: 'Guest',
                email: 'guest@brotein.com',
                package: 'FREE',
                guest: true,
                loggedIn: true
            }));

            setStatus('Continuing as guest...', 'success');
            window.location.href = 'index.html';
        });
    </script>
</body>
</html>
