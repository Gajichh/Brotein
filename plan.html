<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Brotein | Workout Plan</title>
    <link rel="icon" type="image/x-icon" href="broteinico.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0d0d0d;
            --panel: #151515;
            --text: #f3f3f1;
            --muted: #b2b2ad;
            --line: rgba(255,255,255,0.1);
            --chip: rgba(255,255,255,0.06);
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: "Inter", sans-serif;
            background: linear-gradient(180deg, #070707 0%, var(--bg) 26%, #101010 100%);
            color: var(--text);
            overflow-x: hidden;
            -webkit-text-size-adjust: 100%;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        .page-shell {
            width: min(1180px, calc(100% - 24px));
            max-width: 1180px;
            margin: 0 auto;
        }

        header {
            position: sticky;
            top: 0;
            z-index: 10;
            backdrop-filter: blur(16px);
            background: rgba(13, 13, 13, 0.7);
            border-bottom: 1px solid var(--line);
        }

        .nav {
            height: 76px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 18px;
        }

        .brand {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            color: var(--text);
            font-size: 1.05rem;
            font-weight: 700;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            min-width: 0;
        }

        .nav-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .account-wrap {
            position: relative;
            padding-bottom: 14px;
            margin-bottom: -14px;
        }

        .account-trigger {
            width: 38px;
            height: 38px;
            border: 1px solid var(--line);
            border-radius: 50%;
            background: rgba(255,255,255,0.03);
            color: var(--text);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
            padding: 0;
        }

        .account-trigger:hover {
            background: rgba(255,255,255,0.08);
        }

        .account-trigger svg {
            width: 18px;
            height: 18px;
            fill: currentColor;
        }

        .account-menu {
            position: absolute;
            top: calc(100% + 10px);
            left: 50%;
            transform: translateX(-50%) translateY(6px);
            opacity: 0;
            pointer-events: none;
            width: 190px;
            background: rgba(18,18,18,0.98);
            border: 1px solid var(--line);
            border-radius: 16px;
            padding: 12px;
            box-shadow: 0 14px 28px rgba(0,0,0,0.28);
            transition: opacity 0.2s ease, transform 0.2s ease;
            transition-delay: 0.08s;
        }

        .account-wrap:hover .account-menu,
        .account-wrap:focus-within .account-menu,
        .account-wrap.is-open .account-menu {
            opacity: 1;
            pointer-events: auto;
            transform: translateX(-50%) translateY(0);
        }

        .account-name {
            font-size: 0.78rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--muted);
            margin-bottom: 10px;
            text-align: center;
        }

        .account-name.premium-user {
            background: linear-gradient(135deg, #facc15, #f59e0b, #f97316);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .account-menu .menu-btn {
            width: 100%;
            border: 1px solid rgba(255,255,255,0.12);
            background: rgba(255,255,255,0.04);
            color: var(--text);
            border-radius: 999px;
            padding: 10px 12px;
            font: inherit;
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            cursor: pointer;
        }

        .account-menu .upgrade-btn {
            display: none;
            margin-top: 10px;
            background: linear-gradient(135deg, #facc15, #f59e0b, #f97316);
            border-color: rgba(251,191,36,0.6);
            color: #1b1208;
            box-shadow: 0 10px 20px rgba(249,115,22,0.18);
        }

        .account-menu .logout-btn {
            display: none;
            margin-top: 10px;
        }

        .brand-logo {
            display: block;
            width: 110px;
            height: auto;
            object-fit: contain;
            filter: brightness(1.05);
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 28px;
            font-size: 0.8rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--muted);
        }

        .nav-cta {
            border: 1px solid rgba(255,255,255,0.18);
            padding: 12px 18px;
            border-radius: 999px;
            font-size: 0.8rem;
            font-weight: 600;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            transition: all 0.2s ease;
            background: linear-gradient(180deg, rgba(255,255,255,0.04), rgba(255,255,255,0.01));
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.12), 0 6px 18px rgba(0,0,0,0.18);
        }

        .nav-cta:hover {
            background: var(--text);
            color: var(--bg);
        }

        main {
            padding: 56px 0 80px;
        }

        .hero {
            text-align: center;
            margin-bottom: 42px;
        }

        .eyebrow {
            display: inline-block;
            padding: 10px 14px;
            border: 1px solid var(--line);
            border-radius: 999px;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            font-size: 0.7rem;
            color: var(--muted);
            margin-bottom: 18px;
        }

        h1 {
            margin: 0;
            font-size: clamp(2.8rem, 6vw, 6rem);
            letter-spacing: -0.07em;
            line-height: 0.9;
        }

        .subtitle {
            max-width: 650px;
            margin: 18px auto 0;
            color: var(--muted);
            font-size: 1.05rem;
            line-height: 1.75;
        }

        .plan-grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 20px;
            margin-top: 36px;
        }

        .custom-plan {
            margin-top: 36px;
            padding: 26px 20px;
            background: linear-gradient(180deg, rgba(255,255,255,0.04), rgba(255,255,255,0.01));
            border: 1px solid var(--line);
            border-radius: 28px;
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.08), 0 12px 30px rgba(0,0,0,0.12);
        }

        .custom-plan h2 {
            margin: 0 0 18px;
            font-size: clamp(1.8rem, 2.8vw, 2.8rem);
            letter-spacing: -0.06em;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 18px;
        }

        .field {
            display: grid;
            gap: 8px;
        }

        .field.full {
            grid-column: 1 / -1;
        }

        label {
            font-size: 0.72rem;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--muted);
        }

        input, select, button {
            font: inherit;
        }

        input, select {
            width: 100%;
            border: 1px solid var(--line);
            border-radius: 14px;
            background: rgba(255,255,255,0.04);
            color: var(--text);
            padding: 14px 14px;
            color-scheme: dark;
            font-size: 16px;
        }

        select {
            appearance: none;
            background-image:
                linear-gradient(45deg, transparent 50%, var(--text) 50%),
                linear-gradient(135deg, var(--text) 50%, transparent 50%);
            background-position: calc(100% - 18px) calc(50% - 2px), calc(100% - 12px) calc(50% - 2px);
            background-size: 6px 6px, 6px 6px;
            background-repeat: no-repeat;
            padding-right: 36px;
        }

        select option {
            background: #171717;
            color: var(--text);
        }

        input:focus, select:focus {
            outline: none;
            border-color: rgba(255,255,255,0.28);
            box-shadow: 0 0 0 3px rgba(255,255,255,0.06);
        }

        .generate-button {
            margin-top: 18px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            border: 1px solid rgba(255,255,255,0.18);
            border-radius: 999px;
            background: var(--text);
            color: var(--bg);
            min-width: 220px;
            padding: 15px 24px;
            font-size: 0.76rem;
            font-weight: 700;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            cursor: pointer;
            transition: transform 0.2s ease, opacity 0.2s ease;
        }

        .generate-button:hover:not(:disabled) {
            transform: translateY(-1px);
        }

        .generate-button:disabled {
            opacity: 0.75;
            cursor: wait;
        }

        .pdf-icon {
            width: 16px;
            height: 18px;
            display: inline-block;
            flex-shrink: 0;
        }

        .plan-status {
            min-height: 20px;
            margin-top: 14px;
            font-size: 0.72rem;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            color: var(--muted);
        }

        .plan-status.error {
            color: #ff8e8e;
        }

        .plan-status.success {
            color: #9ce6b4;
        }

        .plan-card {
            background: linear-gradient(180deg, rgba(255,255,255,0.04), rgba(255,255,255,0.01));
            border: 1px solid var(--line);
            border-radius: 26px;
            padding: 24px 20px;
        }

        .plan-card .day {
            display: inline-block;
            font-size: 0.72rem;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--muted);
            margin-bottom: 18px;
        }

        .plan-card h2 {
            margin: 0 0 18px;
            font-size: 1.6rem;
            letter-spacing: -0.05em;
        }

        .plan-card ul {
            list-style: none;
            padding: 0;
            margin: 0;
            display: grid;
            gap: 10px;
            color: var(--muted);
        }

        .plan-card li {
            display: flex;
            align-items: flex-start;
            gap: 8px;
            line-height: 1.6;
        }

        .plan-card li::before {
            content: "•";
            color: var(--text);
            font-size: 1.2rem;
            line-height: 1;
            margin-top: 2px;
        }

        .cta {
            display: inline-block;
            margin-top: 36px;
            padding: 16px 24px;
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 999px;
            text-decoration: none;
            color: var(--text);
            font-size: 0.8rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            font-weight: 700;
        }

        @media (max-width: 980px) {
            .page-shell {
                width: min(100%, calc(100% - 18px));
            }
        }

        @media (max-width: 820px) {
            .nav {
                gap: 12px;
                flex-wrap: wrap;
            }

            .nav-left {
                flex: 1;
                min-width: 0;
            }

            .nav-cta {
                margin-left: auto;
            }

            .nav-links {
                display: none;
            }

            .nav-cta {
                padding: 10px 14px;
                font-size: 0.68rem;
            }

            .brand-logo {
                width: 90px;
            }

            .plan-grid,
            .form-grid {
                grid-template-columns: 1fr;
            }

            .page-shell {
                width: min(100%, calc(100% - 20px));
            }

            .cta,
            .generate-button {
                width: 100%;
                text-align: center;
            }
        }

        @media (max-width: 480px) {
            header {
                padding-top: 18px;
            }

            .nav {
                gap: 8px;
            }

            .nav-left {
                gap: 8px;
            }

            .account-trigger {
                width: 34px;
                height: 34px;
            }

            .account-menu {
                width: 170px;
            }

            .brand {
                font-size: 0.86rem;
                letter-spacing: 0.08em;
            }

            .brand-logo {
                width: 82px;
            }

            .nav-cta {
                padding: 9px 12px;
                font-size: 0.62rem;
                letter-spacing: 0.06em;
            }

            h1 {
                font-size: clamp(2.2rem, 16vw, 4rem);
            }

            .subtitle {
                font-size: 0.96rem;
            }

            .custom-plan,
            .plan-card {
                padding: 18px 16px;
            }

            .plan-card h2 {
                font-size: 1.4rem;
            }

            .generate-button {
                min-width: 0;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="page-shell nav">
            <div class="nav-left">
                <div class="account-wrap">
                    <button class="account-trigger" type="button" aria-label="Account menu">
                        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 12a4 4 0 1 0-4-4 4 4 0 0 0 4 4Zm0 2c-4.42 0-8 2.24-8 5v1h16v-1c0-2.76-3.58-5-8-5Z"/></svg>
                    </button>
                    <div class="account-menu">
                        <div class="account-name" id="accountName">Guest</div>
                        <button class="menu-btn upgrade-btn" type="button">Upgrade</button>
                        <button class="menu-btn login-btn" type="button">Log in</button>
                        <button class="menu-btn logout-btn" type="button">Log out</button>
                    </div>
                </div>

                <a href="index.html" class="brand" aria-label="Brotein home">
                    <img src="broteinlogo.png" alt="Brotein logo" class="brand-logo" />
                </a>
            </div>

            <nav class="nav-links" aria-label="Main navigation">
                <a href="index.html">Home</a>
                <a href="calculators.html">Calculators</a>
                <a href="plan.html">Plans</a>
                <a href="contact.html">Contact</a>
            </nav>

            <a href="plan.html" class="nav-cta">Workout Plan</a>
        </div>
    </header>

    <main class="page-shell">
        <section class="hero">
            <div class="eyebrow">Workout plan</div>
            <h1>Generate your personal plan</h1>
            <p class="subtitle">Tell us what you can train, what your goal is, and we’ll build a plan based on your body and your schedule.</p>
        </section>

        <section class="custom-plan" aria-labelledby="custom-plan-heading">
            <h2 id="custom-plan-heading">Build your plan</h2>
            <form id="planForm">
                <div class="form-grid">
                    <div class="field">
                        <label for="name">Name (optional)</label>
                        <input id="name" name="name" type="text" placeholder="Your name" />
                    </div>

                    <div class="field">
                        <label for="gender">Gender</label>
                        <select id="gender" name="gender">
                            <option value="male" selected>Male</option>
                            <option value="female">Female</option>
                        </select>
                    </div>

                    <div class="field">
                        <label for="weight">Weight</label>
                        <input id="weight" name="weight" type="number" min="0" step="0.1" value="0" required />
                    </div>

                    <div class="field">
                        <label for="weightUnit">Weight unit</label>
                        <select id="weightUnit" name="weightUnit">
                            <option value="kg" selected>Kgs</option>
                            <option value="lbs">Lbs</option>
                        </select>
                    </div>

                    <div class="field">
                        <label for="height">Height (cm)</label>
                        <input id="height" name="height" type="number" min="0" step="0.1" value="0" required />
                    </div>

                    <div class="field">
                        <label for="age">Age</label>
                        <input id="age" name="age" type="number" min="0" max="80" value="0" required />
                    </div>

                    <div class="field">
                        <label for="days">Training days per week</label>
                        <select id="days" name="days">
                            <option value="0" selected>0 days</option>
                            <option value="2">2 days</option>
                            <option value="3">3 days</option>
                            <option value="4">4 days</option>
                            <option value="5">5 days</option>
                            <option value="6">6 days</option>
                        </select>
                    </div>

                    <div class="field">
                        <label for="goal">Goal</label>
                        <select id="goal" name="goal">
                            <option value="" selected>Select goal</option>
                            <option value="loss">Weight loss</option>
                            <option value="maintain">Maintain</option>
                            <option value="gain">Weight gain</option>
                            <option value="muscle">Muscle gain</option>
                        </select>
                    </div>
                </div>

                <button type="button" class="generate-button" aria-label="Generate the plan as PDF">
                    <svg class="pdf-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                        <path d="M7 2.5h7.5L19.5 7v12.5A2.5 2.5 0 0 1 17 22H7a2.5 2.5 0 0 1-2.5-2.5V5A2.5 2.5 0 0 1 7 2.5zm7 1.2v4.3h4.3L14 3.7zm-1.1 7.8c-1.1 0-1.8.7-1.8 1.9v1.3h1.3v-1.2c0-.5.2-.8.7-.8h.6c.5 0 .8.3.8.8v1.2H15v-1.3c0-1.2-.7-1.9-1.9-1.9zm-3.4 0h1.7v4.6H9.5v-1.6H8.4v1.6H7.1v-4.6h1.3v1.5h1.1v-1.5zm6.2 0h2.2v.9h-1.2v3.7h-1.2v-3.7h-1.1v-.9z" fill="#D93025"/>
                        <path d="M7 2.5h7.5L19.5 7v12.5A2.5 2.5 0 0 1 17 22H7a2.5 2.5 0 0 1-2.5-2.5V5A2.5 2.5 0 0 1 7 2.5Zm7 1.2v4.3h4.3L14 3.7z" fill="#F4B7B0" opacity="0.35"/>
                    </svg>
                    <span>Generate the plan</span>
                </button>
                <a id="openPdfFallback" href="#" style="display:none; margin-top:12px; font-size:0.72rem; letter-spacing:0.08em; text-transform:uppercase; color:#dfe9ff; text-decoration:underline;" target="_blank" rel="noreferrer">Can't download? Open pdf</a>
                <div id="planStatus" class="plan-status" aria-live="polite" role="status"></div>
            </form>
        </section>

        <div style="text-align: center; margin-top: 28px;">
            <a href="index.html" class="cta" target="_blank" rel="noreferrer">Back to home</a>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
    <script>
        function convertWeightToKg(weight, unit) {
            return unit === 'lbs' ? weight / 2.20462 : weight;
        }

        function getGoalPlan(goal, days, gender) {
            const femaleFocus = gender === 'female';
            const goalMap = {
                loss: {
                    label: 'Weight loss',
                    focus: femaleFocus
                        ? 'Create a calorie deficit while prioritizing lower-body strength and keeping the overall program sustainable.'
                        : 'Create a calorie deficit while keeping training performance high and protecting muscle.',
                    weekly: femaleFocus
                        ? 'Keep leg sessions hard and frequent, then use shorter upper-body work with controlled volume.'
                        : 'Use conditioning sparingly and prioritize compound work that keeps muscle while improving conditioning.',
                    nutrition: 'Keep protein high, carbs around your training, and aim for a modest deficit.',
                    split: days >= 5
                        ? (femaleFocus ? ['Legs', 'Upper', 'Legs', 'Lower', 'Conditioning'] : ['Push', 'Pull', 'Legs', 'Upper', 'Lower'])
                        : days === 4
                            ? (femaleFocus ? ['Legs', 'Upper', 'Lower', 'Conditioning'] : ['Push', 'Pull', 'Legs', 'Full Body'])
                            : days === 3
                                ? (femaleFocus ? ['Legs', 'Lower', 'Upper'] : ['Push', 'Pull', 'Legs'])
                                : ['Full Body', 'Full Body']
                },
                maintain: {
                    label: 'Maintain',
                    focus: femaleFocus
                        ? 'Keep energy stable while leaning into leg development, muscle retention, and overall athletic performance.'
                        : 'Keep your bodyweight stable while improving performance and strength.',
                    weekly: femaleFocus
                        ? 'Train your lower body with strong weekly frequency and keep upper-body work more supportive than dominant.'
                        : 'Use a balanced split with moderate volume and enough recovery between hard sessions.',
                    nutrition: 'Match calories to maintenance and keep protein steady at 1.6–2.2g/kg.',
                    split: days >= 5
                        ? (femaleFocus ? ['Legs', 'Upper', 'Legs', 'Lower', 'Conditioning'] : ['Push', 'Pull', 'Legs', 'Upper', 'Lower'])
                        : days === 4
                            ? (femaleFocus ? ['Legs', 'Upper', 'Lower', 'Full Body'] : ['Push', 'Pull', 'Legs', 'Full Body'])
                            : days === 3
                                ? (femaleFocus ? ['Legs', 'Upper', 'Lower'] : ['Push', 'Pull', 'Legs'])
                                : ['Full Body', 'Full Body']
                },
                gain: {
                    label: 'Weight gain',
                    focus: femaleFocus
                        ? 'Drive a small calorie surplus while building a stronger lower body and improving overall squat and hinge strength.'
                        : 'Aim for a consistent calorie surplus with extra emphasis on progressive overload.',
                    weekly: femaleFocus
                        ? 'Keep the lower-body work dense and progressive while keeping upper-body work efficient and recovery-friendly.'
                        : 'Use slightly higher work capacity and keep hard sets close to failure while preserving recovery.',
                    nutrition: 'Add 200–300 kcal per day, keep protein high, and prioritize carbs around training.',
                    split: days >= 5
                        ? (femaleFocus ? ['Legs', 'Upper', 'Legs', 'Lower', 'Conditioning'] : ['Push', 'Pull', 'Legs', 'Upper', 'Lower'])
                        : days === 4
                            ? (femaleFocus ? ['Legs', 'Upper', 'Lower', 'Full Body'] : ['Push', 'Pull', 'Legs', 'Full Body'])
                            : days === 3
                                ? (femaleFocus ? ['Legs', 'Lower', 'Upper'] : ['Push', 'Pull', 'Legs'])
                                : ['Full Body', 'Full Body']
                },
                muscle: {
                    label: 'Muscle gain',
                    focus: femaleFocus
                        ? 'Prioritize leg-driven hypertrophy, glute and hamstring growth, and enough recovery to keep performance climbing.'
                        : 'Prioritize progressive overload, extra quality volume, and high-protein nutrition.',
                    weekly: femaleFocus
                        ? 'Legs should lead the week with higher frequency and a little more total volume than the upper body.'
                        : 'Train each muscle group with enough frequency to stimulate growth without crushing recovery.',
                    nutrition: 'Target 1.6–2.2g of protein per kg of bodyweight and a small calorie surplus if needed.',
                    split: days >= 5
                        ? (femaleFocus ? ['Legs', 'Upper', 'Legs', 'Lower', 'Conditioning'] : ['Push', 'Pull', 'Legs', 'Upper', 'Lower'])
                        : days === 4
                            ? (femaleFocus ? ['Legs', 'Upper', 'Lower', 'Full Body'] : ['Push', 'Pull', 'Legs', 'Full Body'])
                            : days === 3
                                ? (femaleFocus ? ['Legs', 'Lower', 'Upper'] : ['Push', 'Pull', 'Legs'])
                                : ['Full Body', 'Full Body']
                }
            };

            return goalMap[goal] || goalMap.muscle;
        }

        function buildPlan(data) {
            const { name, weight, height, age, days, goal, gender, weightUnit } = data;
            const weightKg = convertWeightToKg(weight, weightUnit);
            const goalPlan = getGoalPlan(goal, Number(days), gender);
            const bmi = weightKg / ((height / 100) * (height / 100));

            const sessions = [];
            const split = goalPlan.split;
            for (let i = 0; i < Math.min(Number(days), split.length); i++) {
                const session = split[i];
                if (session === 'Push') {
                    sessions.push({ day: `Day ${i + 1}`, title: 'Push', exercises: ['Barbell Bench Press — 3 x 6', 'Incline DB Press — 3 x 8', 'Seated Overhead Press — 2 x 8', 'Cable Triceps Pressdown — 2 x 10'] });
                } else if (session === 'Pull') {
                    sessions.push({ day: `Day ${i + 1}`, title: 'Pull', exercises: ['Weighted Pull-Up or Lat Pulldown — 3 x 6', 'Single-Arm Row — 3 x 8', 'Chest-Supported Row — 2 x 10', 'Face Pulls — 2 x 12'] });
                } else if (session === 'Legs') {
                    sessions.push({ day: `Day ${i + 1}`, title: 'Legs', exercises: ['Back Squat — 3 x 6', 'Romanian Deadlift — 3 x 8', 'Leg Press — 2 x 10', 'Walking Lunges — 2 x 10'] });
                } else if (session === 'Upper') {
                    sessions.push({ day: `Day ${i + 1}`, title: 'Upper', exercises: ['Bench Press — 3 x 6', 'Pull-Up or Lat Pulldown — 3 x 8', 'Shoulder Press — 2 x 8', 'Cable Row — 2 x 10'] });
                } else if (session === 'Lower') {
                    sessions.push({ day: `Day ${i + 1}`, title: 'Lower', exercises: ['Front Squat or Goblet Squat — 3 x 6', 'Hip Thrust — 3 x 8', 'Leg Curl — 2 x 10', 'Split Squat — 2 x 10'] });
                } else if (session === 'Conditioning') {
                    sessions.push({ day: `Day ${i + 1}`, title: 'Conditioning', exercises: ['Bike Intervals — 6 rounds of 30s hard / 60s easy', 'Rowing — 4 x 500m moderate', 'Core Circuit — 2 x 10 reps each'] });
                } else {
                    sessions.push({ day: `Day ${i + 1}`, title: 'Full Body', exercises: ['Squat or Leg Press — 3 x 6', 'Bench Press or Dumbbell Press — 3 x 8', 'Lat Pulldown — 2 x 10', 'Romanian Deadlift — 2 x 8', 'Planks — 2 x 30s'] });
                }
            }

            const nameLine = name ? `${name}'s` : 'Your';
            const planText = [
                `${nameLine} Brotein training plan`,
                `Goal: ${goalPlan.label}`,
                `Gender: ${gender === 'female' ? 'Female' : 'Male'}`,
                `Weight: ${weightKg.toFixed(1)} kg | Height: ${height} cm | Age: ${age}`,
                `Training days: ${days} / week`,
                `Estimated BMI: ${bmi.toFixed(1)}`,
                '',
                'Focus:',
                goalPlan.focus,
                '',
                'Weekly structure:',
                goalPlan.weekly,
                '',
                'Nutrition:',
                goalPlan.nutrition,
                '',
                'Training schedule:'
            ];

            sessions.forEach((session) => {
                planText.push(`\n${session.day} - ${session.title}`);
                session.exercises.forEach((exercise) => planText.push(`- ${exercise}`));
            });

            planText.push('', 'Recovery guidance:', '- Sleep 7–9 hours nightly', '- Keep 1–2 rest days if training 4+ days/week', '- Add 5–10 min of warmup before each training day', '- Progress by adding reps, then load every 1–2 weeks');

            return planText.join('\n');
        }

        function drawSection(doc, title, lines, startY, leftMargin, width) {
            doc.setDrawColor(255, 255, 255);
            doc.setFillColor(22, 22, 22);
            doc.roundedRect(leftMargin, startY, width, 22, 8, 8, 'F');
            doc.setTextColor(243, 243, 241);
            doc.setFont('helvetica', 'bold');
            doc.setFontSize(12);
            doc.text(title, leftMargin + 12, startY + 15);

            let y = startY + 34;
            doc.setFont('helvetica', 'normal');
            doc.setFontSize(10.5);
            doc.setTextColor(225, 225, 225);

            lines.forEach((line) => {
                const text = line.startsWith('- ') ? `• ${line.slice(2)}` : line;
                const splitLines = doc.splitTextToSize(text, width - 18);
                doc.text(splitLines, leftMargin + 10, y);
                y += splitLines.length * 12 + 4;
            });

            return y + 12;
        }

        function setPlanStatus(message, type = '') {
            const statusEl = document.getElementById('planStatus');
            if (!statusEl) return;
            statusEl.textContent = message;
            statusEl.className = 'plan-status';
            if (type) statusEl.classList.add(type);
        }

        function isPremiumAccount() {
            const user = getCurrentUser();
            return String(user?.package || 'FREE').toUpperCase() === 'PREMIUM';
        }

        function canGeneratePlan() {
            const weight = Number(document.getElementById('weight')?.value || 0);
            const height = Number(document.getElementById('height')?.value || 0);
            const days = Number(document.getElementById('days')?.value || 0);
            const goal = document.getElementById('goal')?.value || '';

            return weight > 0 && height > 0 && days > 0 && goal !== '';
        }

        function updateGenerateButtonState() {
            const button = document.querySelector('.generate-button');
            if (!button) return;

            const hasInputs = canGeneratePlan();
            const isPremium = isPremiumAccount();
            const allowed = hasInputs && isPremium;

            button.disabled = !allowed;
            button.style.opacity = allowed ? '1' : '0.7';
            button.style.cursor = allowed ? 'pointer' : 'not-allowed';

            const label = button.querySelector('span');
            if (label) {
                label.textContent = isPremium ? 'Generate the plan' : 'ONLY 0.99$';
            }

            if (!hasInputs && isPremium) {
                setPlanStatus('Enter weight, height, goal, and training days to generate the plan.', 'error');
            } else if (!isPremium) {
                setPlanStatus('Premium access required. Unlock the full plan for only 0.99$.', 'error');
            } else {
                setPlanStatus('');
            }
        }

        function showOpenPdfFallback(pdfUrl) {
            const fallback = document.getElementById('openPdfFallback');
            if (!fallback) return;
            fallback.href = pdfUrl;
            fallback.style.display = 'inline-block';
        }

        async function generatePdf() {
            if (!isPremiumAccount()) {
                setPlanStatus('Premium access required. Unlock the full plan for only 0.99$.', 'error');
                updateGenerateButtonState();
                return;
            }

            if (!canGeneratePlan()) {
                setPlanStatus('Enter weight, height, goal, and training days to generate the plan.', 'error');
                return;
            }

            const form = document.getElementById('planForm');
            const formData = new FormData(form);
            const weight = Number(formData.get('weight'));
            const weightUnit = formData.get('weightUnit') || 'kg';
            const weightKg = convertWeightToKg(weight, weightUnit);
            const payload = {
                name: formData.get('name').trim(),
                weight: weightKg,
                height: Number(formData.get('height')),
                age: Number(formData.get('age')),
                days: Number(formData.get('days')),
                goal: formData.get('goal'),
                gender: formData.get('gender') || 'male'
            };

            const generateButton = document.querySelector('.generate-button');
            if (generateButton) generateButton.disabled = true;
            setPlanStatus('Generating your PDF...', 'success');

            try {
                const { jsPDF } = window.jspdf;
                const doc = new jsPDF({ unit: 'pt', format: 'a4' });
                const pageWidth = doc.internal.pageSize.getWidth();
                const pageHeight = doc.internal.pageSize.getHeight();
                const margin = 52;
                const width = pageWidth - (margin * 2);
                let y = 52;

                doc.setFillColor(13, 13, 13);
                doc.rect(0, 0, pageWidth, pageHeight, 'F');
                doc.setDrawColor(255, 255, 255);
                doc.setLineWidth(1);

                doc.setTextColor(243, 243, 241);
                doc.setFont('helvetica', 'bold');
                doc.setFontSize(26);
                doc.text('Brotein Training Plan', margin, y);

            y += 30;
            doc.setFont('helvetica', 'normal');
            doc.setFontSize(11);
            doc.setTextColor(178, 178, 173);
            doc.text(`${payload.name || 'Athlete'} • ${new Date().toLocaleDateString()} • ${payload.goal ? payload.goal.charAt(0).toUpperCase() + payload.goal.slice(1) : 'Muscle gain'} goal`, margin, y);

            y += 26;
            doc.setDrawColor(255, 255, 255);
            doc.setFillColor(20, 20, 20);
            doc.roundedRect(margin, y, width, 70, 10, 10, 'FD');
            doc.setTextColor(243, 243, 241);
            doc.setFont('helvetica', 'bold');
            doc.setFontSize(11);
            doc.text('Overview', margin + 16, y + 18);
            doc.setFont('helvetica', 'normal');
            doc.setFontSize(10.5);
            doc.text(`Training days: ${payload.days} / week`, margin + 16, y + 36);
            doc.text(`Gender: ${payload.gender === 'female' ? 'Female' : 'Male'}`, margin + 220, y + 36);
            doc.text(`Weight: ${payload.weight.toFixed(1)} kg`, margin + 16, y + 50);
            doc.text(`Height: ${payload.height} cm`, margin + 180, y + 50);
            doc.text(`Age: ${payload.age}`, margin + 300, y + 50);
            doc.text(`Estimated BMI: ${(payload.weight / ((payload.height / 100) * (payload.height / 100))).toFixed(1)}`, margin + 16, y + 64);

            y += 90;

            const goalPlan = getGoalPlan(payload.goal, payload.days, payload.gender);
            const overviewLines = [goalPlan.focus, goalPlan.weekly, goalPlan.nutrition];
            y = drawSection(doc, 'Plan Focus', overviewLines, y, margin, width);

            const sessions = [];
            const split = goalPlan.split;
            for (let i = 0; i < Math.min(Number(payload.days), split.length); i++) {
                const session = split[i];
                if (session === 'Push') {
                    sessions.push({ title: 'Push', exercises: ['Barbell Bench Press — 3 x 6', 'Incline DB Press — 3 x 8', 'Seated Overhead Press — 2 x 8', 'Cable Triceps Pressdown — 2 x 10'] });
                } else if (session === 'Pull') {
                    sessions.push({ title: 'Pull', exercises: ['Weighted Pull-Up or Lat Pulldown — 3 x 6', 'Single-Arm Row — 3 x 8', 'Chest-Supported Row — 2 x 10', 'Face Pulls — 2 x 12'] });
                } else if (session === 'Legs') {
                    sessions.push({ title: 'Legs', exercises: ['Back Squat — 3 x 6', 'Romanian Deadlift — 3 x 8', 'Leg Press — 2 x 10', 'Walking Lunges — 2 x 10'] });
                } else if (session === 'Upper') {
                    sessions.push({ title: 'Upper', exercises: ['Bench Press — 3 x 6', 'Pull-Up or Lat Pulldown — 3 x 8', 'Shoulder Press — 2 x 8', 'Cable Row — 2 x 10'] });
                } else if (session === 'Lower') {
                    sessions.push({ title: 'Lower', exercises: ['Front Squat or Goblet Squat — 3 x 6', 'Hip Thrust — 3 x 8', 'Leg Curl — 2 x 10', 'Split Squat — 2 x 10'] });
                } else if (session === 'Conditioning') {
                    sessions.push({ title: 'Conditioning', exercises: ['Bike Intervals — 6 rounds of 30s hard / 60s easy', 'Rowing — 4 x 500m moderate', 'Core Circuit — 2 x 10 reps each'] });
                } else {
                    sessions.push({ title: 'Full Body', exercises: ['Squat or Leg Press — 3 x 6', 'Bench Press or Dumbbell Press — 3 x 8', 'Lat Pulldown — 2 x 10', 'Romanian Deadlift — 2 x 8', 'Planks — 2 x 30s'] });
                }
            }

            const daySection = [];
            sessions.forEach((session, index) => {
                daySection.push(`Day ${index + 1} — ${session.title}`);
                session.exercises.forEach((exercise) => daySection.push(`- ${exercise}`));
                daySection.push('');
            });
            y = drawSection(doc, 'Weekly Schedule', daySection, y, margin, width);

            const recoveryLines = [
                'Sleep 7–9 hours nightly',
                'Keep 1–2 rest days if training 4+ days a week',
                'Warm up for 5–10 minutes before each session',
                'Progress with reps first, then load every 1–2 weeks'
            ];
            y = drawSection(doc, 'Recovery Rules', recoveryLines, y, margin, width);

                const filename = `${(payload.name || 'athlete').replace(/\s+/g, '_').toLowerCase()}_brotein_plan.pdf`;
                const pdfBlob = doc.output('blob');
                const pdfUrl = URL.createObjectURL(pdfBlob);

                try {
                    const link = document.createElement('a');
                    link.href = pdfUrl;
                    link.download = filename;
                    link.style.display = 'none';
                    document.body.appendChild(link);
                    link.click();
                    link.remove();
                    setPlanStatus('PDF downloaded.', 'success');
                } catch (error) {
                    showOpenPdfFallback(pdfUrl);
                    setPlanStatus('Download blocked by your browser. Use the link below.', 'error');
                }

                setTimeout(() => URL.revokeObjectURL(pdfUrl), 2000);
            } catch (error) {
                console.error('PDF generation failed:', error);
                setPlanStatus('Something went wrong. Please try again.', 'error');
            } finally {
                if (generateButton) generateButton.disabled = false;
            }
        }

        const CURRENT_USER_KEY = 'brotein_current_user';

        function getCurrentUser() {
            try {
                const user = JSON.parse(localStorage.getItem(CURRENT_USER_KEY) || 'null');
                return user && user.loggedIn ? user : null;
            } catch (error) {
                return null;
            }
        }

        function updateAccountMenu() {
            const user = getCurrentUser();
            const nameEl = document.getElementById('accountName');
            const loginBtn = document.querySelector('.login-btn');
            const logoutBtn = document.querySelector('.logout-btn');
            const upgradeBtn = document.querySelector('.upgrade-btn');

            if (!nameEl || !loginBtn || !logoutBtn) return;

            const isGuest = !!user && user.guest === true;
            const packageName = (user && user.package) ? String(user.package).toUpperCase() : 'FREE';
            const isPremium = packageName === 'PREMIUM';
            nameEl.classList.toggle('premium-user', isPremium);

            if (isGuest) {
                nameEl.textContent = 'Guest';
                loginBtn.textContent = 'LOG IN';
                loginBtn.style.display = 'block';
                logoutBtn.style.display = 'none';
                if (upgradeBtn) {
                    upgradeBtn.style.display = 'none';
                }
                return;
            }

            if (user) {
                const displayName = user.name || 'User';
                nameEl.textContent = displayName;
                loginBtn.textContent = 'Log in';
                loginBtn.style.display = 'none';
                logoutBtn.style.display = 'block';
                if (upgradeBtn) {
                    upgradeBtn.style.display = isPremium ? 'none' : 'block';
                }
            } else {
                nameEl.textContent = 'Guest';
                loginBtn.textContent = 'LOG IN';
                loginBtn.style.display = 'block';
                logoutBtn.style.display = 'none';
                if (upgradeBtn) {
                    upgradeBtn.style.display = 'none';
                }
            }
        }

        document.querySelector('.login-btn')?.addEventListener('click', function () {
            window.location.href = 'login.html';
        });

        document.querySelector('.upgrade-btn')?.addEventListener('click', function () {
            window.location.href = 'upgrade.html';
        });

        document.querySelector('.logout-btn')?.addEventListener('click', function () {
            localStorage.removeItem(CURRENT_USER_KEY);
            window.location.reload();
        });

        document.querySelector('.account-trigger')?.addEventListener('click', function (event) {
            const accountWrap = this.closest('.account-wrap');
            if (!accountWrap) return;
            accountWrap.classList.toggle('is-open');
            event.stopPropagation();
        });

        document.addEventListener('click', function (event) {
            const accountWrap = document.querySelector('.account-wrap');
            if (accountWrap && !accountWrap.contains(event.target)) {
                accountWrap.classList.remove('is-open');
            }
        });

        updateGenerateButtonState();

        const planForm = document.getElementById('planForm');
        const generateButton = document.querySelector('.generate-button');

        ['weight', 'height', 'days', 'goal'].forEach((id) => {
            const el = document.getElementById(id);
            if (el) {
                el.addEventListener('input', updateGenerateButtonState);
                el.addEventListener('change', updateGenerateButtonState);
            }
        });

        planForm.addEventListener('submit', function (event) {
            event.preventDefault();
        });

        generateButton.addEventListener('click', async function () {
            if (!canGeneratePlan()) {
                setPlanStatus('Enter weight, height, goal, and training days to generate the plan.', 'error');
                return;
            }

            try {
                await generatePdf();
            } catch (error) {
                console.error('Plan generation failed:', error);
                setPlanStatus('Something went wrong. Please try again.', 'error');
            }
        });

        updateGenerateButtonState();
        updateAccountMenu();
    </script>
</body>
</html>
