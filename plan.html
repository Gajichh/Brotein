<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Brotein | Workout Plan</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0d0d0d;
            --panel: #151515;
            --text: #f3f3f1;
            --muted: #b2b2ad;
            --line: rgba(255,255,255,0.1);
            --chip: rgba(255,255,255,0.06);
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: "Inter", sans-serif;
            background: linear-gradient(180deg, #070707 0%, var(--bg) 26%, #101010 100%);
            color: var(--text);
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        .page-shell {
            width: min(1180px, calc(100% - 24px));
            max-width: 1180px;
            margin: 0 auto;
        }

        header {
            position: sticky;
            top: 0;
            z-index: 10;
            backdrop-filter: blur(16px);
            background: rgba(13, 13, 13, 0.7);
            border-bottom: 1px solid var(--line);
        }

        .nav {
            height: 76px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 18px;
        }

        .brand {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            color: var(--text);
            font-size: 1.05rem;
            font-weight: 700;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            min-width: 0;
        }

        .brand-logo {
            display: block;
            width: 130px;
            height: auto;
            object-fit: contain;
            filter: brightness(1.05);
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 28px;
            font-size: 0.8rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--muted);
        }

        .nav-cta {
            border: 1px solid rgba(255,255,255,0.18);
            padding: 12px 18px;
            border-radius: 999px;
            font-size: 0.8rem;
            font-weight: 600;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            transition: all 0.2s ease;
            background: linear-gradient(180deg, rgba(255,255,255,0.04), rgba(255,255,255,0.01));
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.12), 0 6px 18px rgba(0,0,0,0.18);
        }

        .nav-cta:hover {
            background: var(--text);
            color: var(--bg);
        }

        main {
            padding: 56px 0 80px;
        }

        .hero {
            text-align: center;
            margin-bottom: 42px;
        }

        .eyebrow {
            display: inline-block;
            padding: 10px 14px;
            border: 1px solid var(--line);
            border-radius: 999px;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            font-size: 0.7rem;
            color: var(--muted);
            margin-bottom: 18px;
        }

        h1 {
            margin: 0;
            font-size: clamp(2.8rem, 6vw, 6rem);
            letter-spacing: -0.07em;
            line-height: 0.9;
        }

        .subtitle {
            max-width: 650px;
            margin: 18px auto 0;
            color: var(--muted);
            font-size: 1.05rem;
            line-height: 1.75;
        }

        .plan-grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 20px;
            margin-top: 36px;
        }

        .custom-plan {
            margin-top: 36px;
            padding: 26px 20px;
            background: linear-gradient(180deg, rgba(255,255,255,0.04), rgba(255,255,255,0.01));
            border: 1px solid var(--line);
            border-radius: 28px;
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.08), 0 12px 30px rgba(0,0,0,0.12);
        }

        .custom-plan h2 {
            margin: 0 0 18px;
            font-size: clamp(1.8rem, 2.8vw, 2.8rem);
            letter-spacing: -0.06em;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 18px;
        }

        .field {
            display: grid;
            gap: 8px;
        }

        .field.full {
            grid-column: 1 / -1;
        }

        label {
            font-size: 0.72rem;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--muted);
        }

        input, select, button {
            font: inherit;
        }

        input, select {
            width: 100%;
            border: 1px solid var(--line);
            border-radius: 14px;
            background: rgba(255,255,255,0.04);
            color: var(--text);
            padding: 14px 14px;
            color-scheme: dark;
        }

        select {
            appearance: none;
            background-image:
                linear-gradient(45deg, transparent 50%, var(--text) 50%),
                linear-gradient(135deg, var(--text) 50%, transparent 50%);
            background-position: calc(100% - 18px) calc(50% - 2px), calc(100% - 12px) calc(50% - 2px);
            background-size: 6px 6px, 6px 6px;
            background-repeat: no-repeat;
            padding-right: 36px;
        }

        select option {
            background: #171717;
            color: var(--text);
        }

        input:focus, select:focus {
            outline: none;
            border-color: rgba(255,255,255,0.28);
            box-shadow: 0 0 0 3px rgba(255,255,255,0.06);
        }

        .generate-button {
            margin-top: 20px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            border: 1px solid rgba(255,255,255,0.18);
            border-radius: 999px;
            background: var(--text);
            color: var(--bg);
            min-width: 220px;
            padding: 15px 24px;
            font-size: 0.76rem;
            font-weight: 700;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            cursor: pointer;
            transition: transform 0.2s ease;
        }

        .generate-button:hover {
            transform: translateY(-1px);
        }

        .pdf-icon {
            width: 14px;
            height: 14px;
            display: inline-block;
            position: relative;
            flex-shrink: 0;
        }

        .pdf-icon::before {
            content: "";
            position: absolute;
            inset: 0;
            border: 1.5px solid var(--bg);
            border-radius: 2px;
            background: rgba(0,0,0,0.03);
        }

        .pdf-icon::after {
            content: "";
            position: absolute;
            right: 0;
            top: 0;
            width: 5px;
            height: 5px;
            background: var(--bg);
            clip-path: polygon(0 0, 100% 0, 100% 100%);
        }

        .plan-card {
            background: linear-gradient(180deg, rgba(255,255,255,0.04), rgba(255,255,255,0.01));
            border: 1px solid var(--line);
            border-radius: 26px;
            padding: 24px 20px;
        }

        .plan-card .day {
            display: inline-block;
            font-size: 0.72rem;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--muted);
            margin-bottom: 18px;
        }

        .plan-card h2 {
            margin: 0 0 18px;
            font-size: 1.6rem;
            letter-spacing: -0.05em;
        }

        .plan-card ul {
            list-style: none;
            padding: 0;
            margin: 0;
            display: grid;
            gap: 10px;
            color: var(--muted);
        }

        .plan-card li {
            display: flex;
            align-items: flex-start;
            gap: 8px;
            line-height: 1.6;
        }

        .plan-card li::before {
            content: "•";
            color: var(--text);
            font-size: 1.2rem;
            line-height: 1;
            margin-top: 2px;
        }

        .cta {
            display: inline-block;
            margin-top: 36px;
            padding: 16px 24px;
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 999px;
            text-decoration: none;
            color: var(--text);
            font-size: 0.8rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            font-weight: 700;
        }

        @media (max-width: 980px) {
            .page-shell {
                width: min(100%, calc(100% - 18px));
            }
        }

        @media (max-width: 820px) {
            .plan-grid,
            .form-grid {
                grid-template-columns: 1fr;
            }

            .page-shell {
                width: min(100%, calc(100% - 20px));
            }

            .cta,
            .generate-button {
                width: 100%;
                text-align: center;
            }
        }

        @media (max-width: 480px) {
            header {
                padding-top: 18px;
            }

            .brand {
                font-size: 0.86rem;
                letter-spacing: 0.08em;
            }

            h1 {
                font-size: clamp(2.2rem, 16vw, 4rem);
            }

            .subtitle {
                font-size: 0.96rem;
            }

            .custom-plan,
            .plan-card {
                padding: 18px 16px;
            }

            .plan-card h2 {
                font-size: 1.4rem;
            }

            .generate-button {
                min-width: 0;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="page-shell nav">
            <a href="index.html" class="brand" aria-label="Brotein home">
                <img src="broteinlogo.png" alt="Brotein logo" class="brand-logo" />
            </a>

            <nav class="nav-links" aria-label="Main navigation">
                <a href="index.html">Home</a>
                <a href="calculators.html">Calculators</a>
                <a href="plan.html">Plans</a>
                <a href="contact.html">Contact</a>
            </nav>

            <a href="plan.html" class="nav-cta">Workout Plan</a>
        </div>
    </header>

    <main class="page-shell">
        <section class="hero">
            <div class="eyebrow">Workout plan</div>
            <h1>Generate your personal plan</h1>
            <p class="subtitle">Tell us what you can train, what your goal is, and we’ll build a plan based on your body and your schedule.</p>
        </section>

        <section class="custom-plan" aria-labelledby="custom-plan-heading">
            <h2 id="custom-plan-heading">Build your plan</h2>
            <form id="planForm">
                <div class="form-grid">
                    <div class="field">
                        <label for="name">Name (optional)</label>
                        <input id="name" name="name" type="text" placeholder="Your name" />
                    </div>

                    <div class="field">
                        <label for="gender">Gender</label>
                        <select id="gender" name="gender">
                            <option value="male" selected>Male</option>
                            <option value="female">Female</option>
                        </select>
                    </div>

                    <div class="field">
                        <label for="weight">Weight</label>
                        <input id="weight" name="weight" type="number" min="30" step="0.1" value="75" required />
                    </div>

                    <div class="field">
                        <label for="weightUnit">Weight unit</label>
                        <select id="weightUnit" name="weightUnit">
                            <option value="kg" selected>Kgs</option>
                            <option value="lbs">Lbs</option>
                        </select>
                    </div>

                    <div class="field">
                        <label for="height">Height (cm)</label>
                        <input id="height" name="height" type="number" min="100" step="0.1" value="178" required />
                    </div>

                    <div class="field">
                        <label for="age">Age</label>
                        <input id="age" name="age" type="number" min="16" max="80" value="28" required />
                    </div>

                    <div class="field">
                        <label for="days">Training days per week</label>
                        <select id="days" name="days">
                            <option value="2">2 days</option>
                            <option value="3">3 days</option>
                            <option value="4">4 days</option>
                            <option value="5" selected>5 days</option>
                            <option value="6">6 days</option>
                        </select>
                    </div>

                    <div class="field">
                        <label for="goal">Goal</label>
                        <select id="goal" name="goal">
                            <option value="loss">Weight loss</option>
                            <option value="maintain">Maintain</option>
                            <option value="gain">Weight gain</option>
                            <option value="muscle" selected>Muscle gain</option>
                        </select>
                    </div>
                </div>

                <button type="submit" class="generate-button">
                    <span class="pdf-icon" aria-hidden="true"></span>
                    <span>Generate the plan</span>
                </button>
            </form>
        </section>

        <div style="text-align: center; margin-top: 28px;">
            <a href="index.html" class="cta" target="_blank" rel="noreferrer">Back to home</a>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
    <script>
        function convertWeightToKg(weight, unit) {
            return unit === 'lbs' ? weight / 2.20462 : weight;
        }

        function getGoalPlan(goal, days, gender) {
            const femaleFocus = gender === 'female';
            const goalMap = {
                loss: {
                    label: 'Weight loss',
                    focus: femaleFocus
                        ? 'Create a calorie deficit while prioritizing lower-body strength and keeping the overall program sustainable.'
                        : 'Create a calorie deficit while keeping training performance high and protecting muscle.',
                    weekly: femaleFocus
                        ? 'Keep leg sessions hard and frequent, then use shorter upper-body work with controlled volume.'
                        : 'Use 2–3 short conditioning blocks and prioritize compound lifts with controlled volume.',
                    nutrition: 'Keep protein high, carbs around your training, and aim for a modest deficit.',
                    split: femaleFocus
                        ? (days >= 5 ? ['Legs', 'Upper', 'Legs', 'Lower', 'Conditioning'] : days >= 3 ? ['Legs', 'Lower', 'Conditioning'] : ['Legs', 'Conditioning'])
                        : (days >= 5 ? ['Upper', 'Lower', 'Upper', 'Lower', 'Conditioning'] : days >= 3 ? ['Full Body', 'Full Body', 'Conditioning'] : ['Full Body', 'Conditioning'])
                },
                maintain: {
                    label: 'Maintain',
                    focus: femaleFocus
                        ? 'Keep energy stable while leaning into leg development, muscle retention, and overall athletic performance.'
                        : 'Keep your bodyweight stable while improving performance and strength.',
                    weekly: femaleFocus
                        ? 'Train your lower body with strong weekly frequency and keep upper-body work more supportive than dominant.'
                        : 'Use a balanced split with moderate volume and enough recovery between hard sessions.',
                    nutrition: 'Match calories to maintenance and keep protein steady at 1.6–2.2g/kg.',
                    split: femaleFocus
                        ? (days >= 5 ? ['Legs', 'Upper', 'Legs', 'Lower', 'Conditioning'] : days >= 3 ? ['Legs', 'Upper', 'Lower'] : ['Legs', 'Full Body'])
                        : (days >= 5 ? ['Push', 'Pull', 'Legs', 'Upper', 'Lower'] : days >= 3 ? ['Push', 'Pull', 'Legs'] : ['Full Body', 'Full Body'])
                },
                gain: {
                    label: 'Weight gain',
                    focus: femaleFocus
                        ? 'Drive a small calorie surplus while building a stronger lower body and improving overall squat and hinge strength.'
                        : 'Aim for a consistent calorie surplus with extra emphasis on progressive overload.',
                    weekly: femaleFocus
                        ? 'Keep the lower-body work dense and progressive while keeping upper-body work efficient and recovery-friendly.'
                        : 'Use slightly higher work capacity and keep hard sets close to failure while preserving recovery.',
                    nutrition: 'Add 200–300 kcal per day, keep protein high, and prioritize carbs around training.',
                    split: femaleFocus
                        ? (days >= 5 ? ['Legs', 'Upper', 'Legs', 'Lower', 'Conditioning'] : days >= 3 ? ['Legs', 'Lower', 'Upper'] : ['Legs', 'Full Body'])
                        : (days >= 5 ? ['Push', 'Pull', 'Legs', 'Upper', 'Lower'] : days >= 3 ? ['Push', 'Pull', 'Legs'] : ['Full Body', 'Full Body'])
                },
                muscle: {
                    label: 'Muscle gain',
                    focus: femaleFocus
                        ? 'Prioritize leg-driven hypertrophy, glute and hamstring growth, and enough recovery to keep performance climbing.'
                        : 'Prioritize progressive overload, extra quality volume, and high-protein nutrition.',
                    weekly: femaleFocus
                        ? 'Legs should lead the week with higher frequency and a little more total volume than the upper body.'
                        : 'Train each muscle group with enough frequency to stimulate growth without crushing recovery.',
                    nutrition: 'Target 1.6–2.2g of protein per kg of bodyweight and a small calorie surplus if needed.',
                    split: femaleFocus
                        ? (days >= 5 ? ['Legs', 'Upper', 'Legs', 'Lower', 'Conditioning'] : days >= 3 ? ['Legs', 'Lower', 'Upper'] : ['Legs', 'Full Body'])
                        : (days >= 5 ? ['Push', 'Pull', 'Legs', 'Upper', 'Lower'] : days >= 3 ? ['Push', 'Pull', 'Legs'] : ['Full Body', 'Full Body'])
                }
            };

            return goalMap[goal] || goalMap.muscle;
        }

        function buildPlan(data) {
            const { name, weight, height, age, days, goal, gender, weightUnit } = data;
            const weightKg = convertWeightToKg(weight, weightUnit);
            const goalPlan = getGoalPlan(goal, Number(days), gender);
            const bmi = weightKg / ((height / 100) * (height / 100));

            const sessions = [];
            const split = goalPlan.split;
            for (let i = 0; i < Math.min(Number(days), split.length); i++) {
                const session = split[i];
                if (session === 'Push') {
                    sessions.push({ day: `Day ${i + 1}`, title: 'Push', exercises: ['Barbell Bench Press — 4 x 6', 'Incline DB Press — 3 x 8', 'Seated Overhead Press — 3 x 8', 'Cable Triceps Pressdown — 3 x 12'] });
                } else if (session === 'Pull') {
                    sessions.push({ day: `Day ${i + 1}`, title: 'Pull', exercises: ['Weighted Pull-Up or Lat Pulldown — 4 x 8', 'Single-Arm Row — 4 x 10', 'Chest-Supported Row — 3 x 10', 'Face Pulls — 3 x 15'] });
                } else if (session === 'Legs') {
                    sessions.push({ day: `Day ${i + 1}`, title: 'Legs', exercises: ['Back Squat — 4 x 6', 'Romanian Deadlift — 3 x 8', 'Leg Press — 3 x 10', 'Walking Lunges — 3 x 12'] });
                } else if (session === 'Upper') {
                    sessions.push({ day: `Day ${i + 1}`, title: 'Upper', exercises: ['Bench Press — 4 x 6', 'Pull-Up or Lat Pulldown — 4 x 8', 'Shoulder Press — 3 x 8', 'Cable Row — 3 x 10'] });
                } else if (session === 'Lower') {
                    sessions.push({ day: `Day ${i + 1}`, title: 'Lower', exercises: ['Front Squat or Goblet Squat — 4 x 6', 'Hip Thrust — 3 x 8', 'Leg Curl — 3 x 10', 'Split Squat — 3 x 12'] });
                } else if (session === 'Conditioning') {
                    sessions.push({ day: `Day ${i + 1}`, title: 'Conditioning', exercises: ['Bike Intervals — 8 rounds of 30s hard / 60s easy', 'Rowing — 5 x 500m', 'Core Circuit — 3 rounds of 15 reps each'] });
                } else {
                    sessions.push({ day: `Day ${i + 1}`, title: 'Full Body', exercises: ['Squat or Leg Press — 4 x 8', 'Bench Press or Dumbbell Press — 4 x 8', 'Lat Pulldown — 3 x 10', 'Romanian Deadlift — 3 x 8', 'Planks — 3 x 45s'] });
                }
            }

            const nameLine = name ? `${name}'s` : 'Your';
            const planText = [
                `${nameLine} Brotein training plan`,
                `Goal: ${goalPlan.label}`,
                `Gender: ${gender === 'female' ? 'Female' : 'Male'}`,
                `Weight: ${weightKg.toFixed(1)} kg | Height: ${height} cm | Age: ${age}`,
                `Training days: ${days} / week`,
                `Estimated BMI: ${bmi.toFixed(1)}`,
                '',
                'Focus:',
                goalPlan.focus,
                '',
                'Weekly structure:',
                goalPlan.weekly,
                '',
                'Nutrition:',
                goalPlan.nutrition,
                '',
                'Training schedule:'
            ];

            sessions.forEach((session) => {
                planText.push(`\n${session.day} - ${session.title}`);
                session.exercises.forEach((exercise) => planText.push(`- ${exercise}`));
            });

            planText.push('', 'Recovery guidance:', '- Sleep 7–9 hours nightly', '- Keep 1–2 rest days if training 4+ days/week', '- Add 5–10 min of warmup before each training day', '- Progress by adding reps, then load every 1–2 weeks');

            return planText.join('\n');
        }

        function drawSection(doc, title, lines, startY, leftMargin, width) {
            doc.setDrawColor(255, 255, 255);
            doc.setFillColor(19, 19, 19);
            doc.roundedRect(leftMargin, startY, width, 22, 8, 8, 'F');
            doc.setTextColor(243, 243, 241);
            doc.setFont('helvetica', 'bold');
            doc.setFontSize(12);
            doc.text(title, leftMargin + 12, startY + 15);

            let y = startY + 34;
            doc.setFont('helvetica', 'normal');
            doc.setFontSize(10.5);
            doc.setTextColor(225, 225, 225);

            lines.forEach((line) => {
                const text = line.startsWith('- ') ? `• ${line.slice(2)}` : line;
                const splitLines = doc.splitTextToSize(text, width - 18);
                doc.text(splitLines, leftMargin + 10, y);
                y += splitLines.length * 12 + 4;
            });

            return y + 12;
        }

        function generatePdf() {
            const form = document.getElementById('planForm');
            const formData = new FormData(form);
            const weight = Number(formData.get('weight'));
            const weightUnit = formData.get('weightUnit') || 'kg';
            const weightKg = convertWeightToKg(weight, weightUnit);
            const payload = {
                name: formData.get('name').trim(),
                weight: weightKg,
                height: Number(formData.get('height')),
                age: Number(formData.get('age')),
                days: Number(formData.get('days')),
                goal: formData.get('goal'),
                gender: formData.get('gender') || 'male'
            };

            const { jsPDF } = window.jspdf;
            const doc = new jsPDF({ unit: 'pt', format: 'a4' });
            const pageWidth = doc.internal.pageSize.getWidth();
            const pageHeight = doc.internal.pageSize.getHeight();
            const margin = 52;
            const width = pageWidth - (margin * 2);
            let y = 52;

            doc.setFillColor(13, 13, 13);
            doc.rect(0, 0, pageWidth, pageHeight, 'F');
            doc.setDrawColor(255, 255, 255);
            doc.setLineWidth(1);

            doc.setTextColor(243, 243, 241);
            doc.setFont('helvetica', 'bold');
            doc.setFontSize(26);
            doc.text('Brotein Training Plan', margin, y);

            doc.setTextColor(255, 255, 255, 0.08);
            doc.setFont('helvetica', 'bold');
            doc.setFontSize(52);
            doc.text('Brotein', 150, 760, { angle: 45 });
            doc.setTextColor(243, 243, 241);

            y += 30;
            doc.setFont('helvetica', 'normal');
            doc.setFontSize(11);
            doc.setTextColor(178, 178, 173);
            doc.text(`${payload.name || 'Athlete'} • ${new Date().toLocaleDateString()} • ${payload.goal ? payload.goal.charAt(0).toUpperCase() + payload.goal.slice(1) : 'Muscle gain'} goal`, margin, y);

            y += 26;
            doc.setDrawColor(255, 255, 255);
            doc.roundedRect(margin, y, width, 70, 10, 10, 'S');
            doc.setTextColor(243, 243, 241);
            doc.setFont('helvetica', 'bold');
            doc.setFontSize(11);
            doc.text('Overview', margin + 16, y + 18);
            doc.setFont('helvetica', 'normal');
            doc.setFontSize(10.5);
            doc.text(`Training days: ${payload.days} / week`, margin + 16, y + 36);
            doc.text(`Gender: ${payload.gender === 'female' ? 'Female' : 'Male'}`, margin + 220, y + 36);
            doc.text(`Weight: ${payload.weight.toFixed(1)} kg`, margin + 16, y + 50);
            doc.text(`Height: ${payload.height} cm`, margin + 180, y + 50);
            doc.text(`Age: ${payload.age}`, margin + 300, y + 50);
            doc.text(`Estimated BMI: ${(payload.weight / ((payload.height / 100) * (payload.height / 100))).toFixed(1)}`, margin + 16, y + 64);

            y += 90;

            const goalPlan = getGoalPlan(payload.goal, payload.days, payload.gender);
            const overviewLines = [goalPlan.focus, goalPlan.weekly, goalPlan.nutrition];
            y = drawSection(doc, 'Plan Focus', overviewLines, y, margin, width);

            const sessions = [];
            const split = goalPlan.split;
            for (let i = 0; i < Math.min(Number(payload.days), split.length); i++) {
                const session = split[i];
                if (session === 'Push') {
                    sessions.push({ title: 'Push', exercises: ['Barbell Bench Press — 4 x 6', 'Incline DB Press — 3 x 8', 'Seated Overhead Press — 3 x 8', 'Cable Triceps Pressdown — 3 x 12'] });
                } else if (session === 'Pull') {
                    sessions.push({ title: 'Pull', exercises: ['Weighted Pull-Up or Lat Pulldown — 4 x 8', 'Single-Arm Row — 4 x 10', 'Chest-Supported Row — 3 x 10', 'Face Pulls — 3 x 15'] });
                } else if (session === 'Legs') {
                    sessions.push({ title: 'Legs', exercises: ['Back Squat — 4 x 6', 'Romanian Deadlift — 3 x 8', 'Leg Press — 3 x 10', 'Walking Lunges — 3 x 12'] });
                } else if (session === 'Upper') {
                    sessions.push({ title: 'Upper', exercises: ['Bench Press — 4 x 6', 'Pull-Up or Lat Pulldown — 4 x 8', 'Shoulder Press — 3 x 8', 'Cable Row — 3 x 10'] });
                } else if (session === 'Lower') {
                    sessions.push({ title: 'Lower', exercises: ['Front Squat or Goblet Squat — 4 x 6', 'Hip Thrust — 3 x 8', 'Leg Curl — 3 x 10', 'Split Squat — 3 x 12'] });
                } else if (session === 'Conditioning') {
                    sessions.push({ title: 'Conditioning', exercises: ['Bike Intervals — 8 rounds of 30s hard / 60s easy', 'Rowing — 5 x 500m', 'Core Circuit — 3 rounds of 15 reps each'] });
                } else {
                    sessions.push({ title: 'Full Body', exercises: ['Squat or Leg Press — 4 x 8', 'Bench Press or Dumbbell Press — 4 x 8', 'Lat Pulldown — 3 x 10', 'Romanian Deadlift — 3 x 8', 'Planks — 3 x 45s'] });
                }
            }

            const daySection = [];
            sessions.forEach((session, index) => {
                daySection.push(`Day ${index + 1} — ${session.title}`);
                session.exercises.forEach((exercise) => daySection.push(`- ${exercise}`));
                daySection.push('');
            });
            y = drawSection(doc, 'Weekly Schedule', daySection, y, margin, width);

            const recoveryLines = [
                'Sleep 7–9 hours nightly',
                'Keep 1–2 rest days if training 4+ days a week',
                'Warm up for 5–10 minutes before each session',
                'Progress with reps first, then load every 1–2 weeks'
            ];
            y = drawSection(doc, 'Recovery Rules', recoveryLines, y, margin, width);

            const filename = `${(payload.name || 'athlete').replace(/\s+/g, '_').toLowerCase()}_brotein_plan.pdf`;
            doc.save(filename);
        }

        document.getElementById('planForm').addEventListener('submit', function (event) {
            event.preventDefault();
            generatePdf();
        });
    </script>
</body>
</html>
